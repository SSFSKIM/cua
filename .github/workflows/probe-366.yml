name: probe-366
# #366: actual enablement readiness. Kit pushes smoke the controlled threshold sweep; full modes are manual.
on:
  push:
    branches: ['probe/366-measure']
    paths: ['.github/workflows/probe-366.yml', 'scripts/probe-366/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Readiness factorial or controlled threshold sweep (8 delays; 2 smoke / 10 full reps)'
        type: choice
        options: [smoke, full, threshold-smoke, threshold]
        default: smoke
permissions:
  contents: read
env:
  ENGINE_REF: b99232def1e37307848dd1ccb08726729eb81b66
concurrency:
  group: probe-366
  cancel-in-progress: false
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [electron, electron-parity, cft]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned owned fixture (Electron 44.4.5, Radix 1.1.15)
        run: |
          npm ci --prefix scripts/probe-366/fixture --no-audit --no-fund
          node scripts/probe-366/build-fixture.mjs
          if [ '${{ matrix.browser }}' = cft ]; then
            test -x '/Applications/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
            '/Applications/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' --version
          fi
      - name: Build instrumented pinned main, only in runner scratch tree
        run: |
          git log -1 --format='kit %H %s'
          git worktree add --detach "$RUNNER_TEMP/src366" "$ENGINE_REF"
          node scripts/probe-366/patch.mjs "$RUNNER_TEMP/src366"
          swift build -c release --package-path "$RUNNER_TEMP/src366/native/engine" --scratch-path "$RUNNER_TEMP/build366"
          swiftc -O -o "$RUNNER_TEMP/tool366" scripts/probe-366/tool.swift
          mkdir -p "$RUNNER_TEMP/Probe366 Cover.app/Contents/MacOS"
          cp "$RUNNER_TEMP/tool366" "$RUNNER_TEMP/Probe366 Cover.app/Contents/MacOS/cover366"
          cp scripts/probe-366/cover.plist "$RUNNER_TEMP/Probe366 Cover.app/Contents/Info.plist"
      - name: Measure (never retries the action)
        env:
          BROWSER: ${{ matrix.browser }}
          SMOKE: ${{ github.event_name == 'push' || inputs.mode == 'smoke' || inputs.mode == 'threshold-smoke' }}
          THRESHOLD: ${{ github.event_name == 'push' || startsWith(inputs.mode, 'threshold') }}
        run: |
          node scripts/probe-366/first-press.mjs --browser "$BROWSER" --smoke "$SMOKE" --threshold "$THRESHOLD" --engine "$RUNNER_TEMP/build366/release/cua-engine" --tool "$RUNNER_TEMP/tool366" --out "$RUNNER_TEMP/probe-366-first/$BROWSER"
      - name: Read denominators and rates
        if: always()
        env:
          THRESHOLD: ${{ github.event_name == 'push' || startsWith(inputs.mode, 'threshold') }}
        run: |
          READER=first-read.mjs
          if [ "$THRESHOLD" = true ]; then READER=threshold-read.mjs; fi
          if [ -f "$RUNNER_TEMP/probe-366-first/${{ matrix.browser }}/rows.jsonl" ]; then
            node "scripts/probe-366/$READER" summary "$RUNNER_TEMP/probe-366-first/${{ matrix.browser }}" > "$RUNNER_TEMP/probe-366-first/${{ matrix.browser }}/summary.json"
            node scripts/probe-366/first-read.mjs readiness "$RUNNER_TEMP/probe-366-first/${{ matrix.browser }}" > "$RUNNER_TEMP/probe-366-first/${{ matrix.browser }}/readiness.json"
            node "scripts/probe-366/$READER" coverage "$RUNNER_TEMP/probe-366-first/${{ matrix.browser }}"
          fi
      - name: Upload owned-fixture evidence (never its browser profile)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-366-first-${{ matrix.browser }}-${{ inputs.mode || 'threshold-smoke' }}
          path: |
            ${{ runner.temp }}/probe-366-first/**/rows.jsonl
            ${{ runner.temp }}/probe-366-first/**/config.json
            ${{ runner.temp }}/probe-366-first/**/progress.json
            ${{ runner.temp }}/probe-366-first/**/fatal.json
            ${{ runner.temp }}/probe-366-first/**/summary.json
            ${{ runner.temp }}/probe-366-first/**/transport.jsonl
            ${{ runner.temp }}/probe-366-first/**/engine-stderr.txt
            ${{ runner.temp }}/probe-366-first/**/app-stdout.txt
            ${{ runner.temp }}/probe-366-first/**/app-stderr.txt
            ${{ runner.temp }}/probe-366-first/**/process-error.txt
            ${{ runner.temp }}/probe-366-first/**/coverage.json
            ${{ runner.temp }}/probe-366-first/**/readiness.json
            ${{ runner.temp }}/probe-366-first/**/shots/**
          if-no-files-found: warn
