# #341's hosted measurement (scripts/probe-341/run.mjs): a click into a scrolled textarea of a background browser page
# behind a frontmost TextEdit, origin/main's engine against raw Accessibility sequences (scripts/probe-341/ax.swift),
# per candidate direction of the fix. Chrome for Testing late and fresh, Safari and Firefox late; two runners each.
# Runs only on a push to probe/341-measure; not a ci-kit gate.
name: probe-341
on:
  push:
    branches: ['probe/341-measure']
    paths-ignore: ['scripts/probe-341/offline/**']
permissions:
  contents: read
env:
  P341_REPEAT: '3'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        group: ['chrome-late', 'chrome-fresh', 'safari', 'firefox']
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Firefox
        if: matrix.group == 'firefox'
        run: |
          if [ -d /Applications/Firefox.app ]; then echo "Firefox preinstalled: $(defaults read /Applications/Firefox.app/Contents/Info CFBundleShortVersionString)"
          else brew install --cask firefox; xattr -dr com.apple.quarantine /Applications/Firefox.app || true; fi
      - name: Build main's engine and the AX tool
        run: |
          sw_vers
          git log -1 --format='kit %H %s'
          git worktree add "$RUNNER_TEMP/main" origin/main
          echo "P341_MAIN_COMMIT=$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build -c release --package-path "$RUNNER_TEMP/main/native/engine" --scratch-path "$RUNNER_TEMP/eng"
          swiftc -O -o "$RUNNER_TEMP/p341-ax" scripts/probe-341/ax.swift
      - name: Measure
        env:
          P341_REP: ${{ matrix.rep }}
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            chrome-late) b=chrome; t=late ;;
            chrome-fresh) b=chrome; t=fresh ;;
            safari) b=safari; t=late ;;
            firefox) b=firefox; t=late ;;
          esac
          node scripts/probe-341/run.mjs --browser "$b" --timing "$t" --engine "$RUNNER_TEMP/eng/release/cua-engine" --ax "$RUNNER_TEMP/p341-ax" --repeat "$P341_REPEAT" --out "$RUNNER_TEMP/p341"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-341-${{ matrix.group }}-rep${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/p341/*.json
            ${{ runner.temp }}/p341/shots-*/**
          if-no-files-found: warn
