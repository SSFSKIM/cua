Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
  Identifier "d0"
  Driver "dummy"
  VideoRam 16384
EndSection
Section "Device"
  Identifier "d1"
  Driver "dummy"
  VideoRam 16384
EndSection
Section "Monitor"
  Identifier "m"
  HorizSync 5.0 - 1000.0
  VertRefresh 5.0 - 200.0
  Modeline "640x480" 25.18 640 656 752 800 480 490 492 525
EndSection
Section "Screen"
  Identifier "s0"
  Device "d0"
  Monitor "m"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "640x480"
    Virtual 640 480
  EndSubSection
EndSection
Section "Screen"
  Identifier "s1"
  Device "d1"
  Monitor "m"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "640x480"
    Virtual 640 480
  EndSubSection
EndSection
Section "ServerLayout"
  Identifier "two"
  Screen 0 "s0"
  Screen 1 "s1" RightOf "s0"
EndSection
