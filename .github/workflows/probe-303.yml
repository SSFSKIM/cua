# #303's hosted A/B (scripts/probe-303/tokens.mjs): Chromium's re-created table columns and header group, origin/main's
# engine against fix/303-recreated-tokens's, on Chrome for Testing: the ticket's 20x5 table, 3,000- and 6,000-row tables,
# a real replacement (a cloned button, an inserted column) and the HN thread of #301's A/B. Two runners. Runs only on a
# push to probe/303-measure; not a ci-kit gate.
name: probe-303
on:
  push:
    branches: ['probe/303-measure']
    paths-ignore: ['scripts/probe-303/offline/**']
permissions:
  contents: read
env:
  P303_BRANCH_REF: 'origin/fix/303-recreated-tokens'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build both engines and the tool
        run: |
          sw_vers
          git worktree add "$RUNNER_TEMP/main" origin/main
          git worktree add "$RUNNER_TEMP/branch" "$P303_BRANCH_REF"
          echo "P303_MAIN_COMMIT=$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "P303_BRANCH_COMMIT=$(git -C "$RUNNER_TEMP/branch" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build -c release --package-path "$RUNNER_TEMP/main/native/engine" --scratch-path "$RUNNER_TEMP/eng-main"
          swift build -c release --package-path "$RUNNER_TEMP/branch/native/engine" --scratch-path "$RUNNER_TEMP/eng-branch"
          swiftc -O -o "$RUNNER_TEMP/probe303-tool" scripts/probe-303/tool.swift
      - name: Measure
        env:
          P303_REP: ${{ matrix.rep }}
        run: node scripts/probe-303/tokens.mjs --main "$RUNNER_TEMP/eng-main/release/cua-engine" --branch "$RUNNER_TEMP/eng-branch/release/cua-engine" --tool "$RUNNER_TEMP/probe303-tool" --out "$RUNNER_TEMP/probe-303"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-303-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/probe-303/*.json
          if-no-files-found: warn
