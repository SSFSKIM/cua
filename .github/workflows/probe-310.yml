# #310's hosted A/B (scripts/probe-310/walk.mjs): AXColumn elements waiting in rule C's last queue, origin/main's engine
# (A) against fix/310-columns-last's (B) on #304's local Chrome tables and on tables that fit the budget: walk time and
# the printed tree. Two runners. Runs only on a push to probe/310-measure; not a ci-kit gate.
name: probe-310
on:
  push:
    branches: ['probe/310-measure']
    paths-ignore: ['scripts/probe-310/offline/**']
permissions:
  contents: read
env:
  P310_B_REF: 'origin/fix/310-columns-last'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build both engines
        run: |
          sw_vers
          git worktree add "$RUNNER_TEMP/a" origin/main
          git worktree add "$RUNNER_TEMP/b" "$P310_B_REF"
          echo "P310_A_COMMIT=$(git -C "$RUNNER_TEMP/a" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "P310_B_COMMIT=$(git -C "$RUNNER_TEMP/b" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build -c release --package-path "$RUNNER_TEMP/a/native/engine" --scratch-path "$RUNNER_TEMP/eng-a"
          swift build -c release --package-path "$RUNNER_TEMP/b/native/engine" --scratch-path "$RUNNER_TEMP/eng-b"
      - name: Measure
        env:
          P310_REP: ${{ matrix.rep }}
        run: node scripts/probe-310/walk.mjs --a "$RUNNER_TEMP/eng-a/release/cua-engine" --b "$RUNNER_TEMP/eng-b/release/cua-engine" --out "$RUNNER_TEMP/probe-310"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-310-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/probe-310/*.json
          if-no-files-found: warn
