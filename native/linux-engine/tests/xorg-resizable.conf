# The private Xorg of tests/two-screens.sh's resize test: the dummy driver, no input devices (the engine's input is
# XTEST's), and one screen that starts at 640x480 and can grow through RandR to 1280x800, as a person's display does when
# a monitor is plugged in or its resolution changed (Xvfb's RandR never grows past the size it started with).
Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
  Identifier "d"
  Driver "dummy"
  VideoRam 16384
EndSection
Section "Monitor"
  Identifier "m"
  HorizSync 5.0 - 1000.0
  VertRefresh 5.0 - 200.0
  Modeline "640x480" 25.18 640 656 752 800 480 490 492 525
  Modeline "1280x800" 83.50 1280 1352 1480 1680 800 803 809 831
EndSection
Section "Screen"
  Identifier "s"
  Device "d"
  Monitor "m"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "640x480" "1280x800"
    Virtual 1280 800
  EndSubSection
EndSection
Section "ServerLayout"
  Identifier "one"
  Screen 0 "s"
EndSection
