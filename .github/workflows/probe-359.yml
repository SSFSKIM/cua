# Hosted A/B authorized by design ruling 1ea561bc:733. Kit pushes run smoke only.
name: probe-359
on:
  push:
    branches: ['probe/359-hosted']
    paths: ['.github/workflows/probe-359.yml', 'scripts/probe-359/**']
  workflow_dispatch:
    inputs:
      reps:
        description: '20 for measurement/candidates, 5 for diagnostic pilot, 1 for smoke'
        default: '1'
        type: choice
        options: ['20', '5', '1']
      smoke:
        description: 'Smoke evidence is not primary-rate evidence'
        default: true
        type: boolean
      diagnostic:
        description: 'Separate corpus: pilot crosses four scenes; confirm repeats original Chrome scene; candidates includes both selections'
        type: choice
        options: ['none', 'pilot', 'confirm', 'candidates']
        default: 'none'
      scene:
        description: 'Candidate diagnostic scene (ignored by pilot/confirm)'
        type: choice
        options: ['foreground-equal', 'foreground-end', 'background-equal', 'background-end']
        default: 'foreground-equal'
      diagnostic_browser:
        description: 'Diagnostic browsers (confirm always uses cft only)'
        type: choice
        options: ['all', 'cft', 'safari', 'firefox']
        default: 'all'
permissions:
  contents: read
env:
  ENGINE_REF: '15acf09b714dd19efc796e4a3a2ff8d57e2f7994'
concurrency:
  group: ${{ inputs.diagnostic && inputs.diagnostic != 'none' && 'probe-359-diagnostic' || 'probe-359' }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        browser: ${{ fromJSON(inputs.diagnostic == 'confirm' && '["cft"]' || (inputs.diagnostic && inputs.diagnostic != 'none' && inputs.diagnostic_browser && inputs.diagnostic_browser != 'all' && format('["{0}"]', inputs.diagnostic_browser) || '["safari","cft","firefox"]')) }}
        editor: ${{ fromJSON(inputs.diagnostic && inputs.diagnostic != 'none' && '["textarea"]' || '["textarea","input","contenteditable","compose"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate measurement inputs
        env:
          REPS: ${{ inputs.reps || '1' }}
          SMOKE: ${{ github.event_name == 'push' || inputs.smoke }}
          DIAGNOSTIC: ${{ inputs.diagnostic || 'none' }}
        run: |
          if [ "$DIAGNOSTIC" = none ]; then
            test "$REPS" = 20 || test "$SMOKE" = true
          else
            test "$SMOKE" = false
            test "$REPS" = 5 || test "$REPS" = 20
          fi
      - name: Disposable runner apps
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          case "$BROWSER" in
            cft) bash scripts/probe-316/install.sh chrome ;;
            firefox)
              bash scripts/probe-316/install.sh firefox
              mkdir -p /Applications/Firefox.app/Contents/Resources/distribution
              printf '%s\n' '{"policies":{"DisableAppUpdate":true}}' > /Applications/Firefox.app/Contents/Resources/distribution/policies.json ;;
            *) bash scripts/probe-316/install.sh ;;
          esac
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
          for key in NSAutomaticSpellingCorrectionEnabled NSAutomaticTextReplacementEnabled NSAutomaticQuoteSubstitutionEnabled NSAutomaticDashSubstitutionEnabled NSAutomaticCapitalizationEnabled NSAutomaticPeriodSubstitutionEnabled; do
            defaults write -g "$key" -bool NO
            defaults write com.apple.TextEdit "$key" -bool NO
          done
      - name: Build pinned plain and traced engines
        run: |
          git log -1 --format='kit %H %s'
          git worktree add --detach "$RUNNER_TEMP/plain" "$ENGINE_REF"
          git worktree add --detach "$RUNNER_TEMP/traced" "$ENGINE_REF"
          node scripts/probe-359/patch.mjs "$RUNNER_TEMP/traced"
          swift build -c release --package-path "$RUNNER_TEMP/plain/native/engine" --scratch-path "$RUNNER_TEMP/plain-build"
          swift build -c release --package-path "$RUNNER_TEMP/traced/native/engine" --scratch-path "$RUNNER_TEMP/traced-build"
          swiftc -O -o "$RUNNER_TEMP/tool359" scripts/probe-354/tool.swift
          swiftc -O -o "$RUNNER_TEMP/watch359" scripts/probe-359/watch.swift
      - name: Measure shared-mode ordering
        env:
          BROWSER: ${{ matrix.browser }}
          EDITOR: ${{ matrix.editor }}
          REPS: ${{ inputs.reps || '1' }}
          SMOKE: ${{ github.event_name == 'push' || inputs.smoke }}
          DIAGNOSTIC: ${{ inputs.diagnostic || 'none' }}
          SCENE: ${{ inputs.scene || 'foreground-equal' }}
          DIAGNOSTIC_BROWSER: ${{ inputs.diagnostic_browser || 'all' }}
        run: |
          node scripts/probe-359/measure.mjs --browser "$BROWSER" --editor "$EDITOR" --engine "$RUNNER_TEMP/plain-build/release/cua-engine" --traced-engine "$RUNNER_TEMP/traced-build/release/cua-engine" --tool "$RUNNER_TEMP/tool359" --watch "$RUNNER_TEMP/watch359" --out "$RUNNER_TEMP/probe-359/$BROWSER-$EDITOR" --reps "$REPS" --smoke "$SMOKE" --diagnostic "$DIAGNOSTIC" --diagnostic-browser "$DIAGNOSTIC_BROWSER" --scene "$SCENE"
      - name: Upload evidence even on incomplete coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-359-${{ matrix.browser }}-${{ matrix.editor }}
          path: |
            ${{ runner.temp }}/probe-359/**/rows.jsonl
            ${{ runner.temp }}/probe-359/**/config.json
            ${{ runner.temp }}/probe-359/**/summary.json
            ${{ runner.temp }}/probe-359/**/progress.json
            ${{ runner.temp }}/probe-359/**/transport.jsonl
            ${{ runner.temp }}/probe-359/**/engine-stderr.txt
            ${{ runner.temp }}/probe-359/**/shots/**
          if-no-files-found: warn
          retention-days: 14
