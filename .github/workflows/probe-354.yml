name: probe-354
on:
  push:
    branches: ['probe/354-measure']
    paths-ignore: ['scripts/probe-354/offline/**', 'scripts/probe-354-fences/**', '.github/workflows/probe-354-fences.yml', '.github/workflows/probe-354.yml', 'scripts/probe-354-substitutions/**', '.github/workflows/probe-354-substitutions.yml', 'docs/**']
  workflow_dispatch:
    inputs:
      reps:
        description: 'Repetitions per cell (20 for full measurement; set 1 for smoke)'
        default: '20'
      smoke:
        description: 'Label this as smoke evidence (also set reps to 1)'
        default: 'false'
permissions:
  contents: read
env:
  ENGINE_REF: '3c669314e0a5f35aedf20f9b792604fc09628c45'
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {id: firefox-textarea-all, browser: firefox, phase: all, editors: textarea}
          - {id: firefox-input-all, browser: firefox, phase: all, editors: input}
          - {id: firefox-contenteditable-all, browser: firefox, phase: all, editors: contenteditable}
          - {id: firefox-compose-all, browser: firefox, phase: all, editors: compose}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apps
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          case "$BROWSER" in
            cft) bash scripts/probe-316/install.sh chrome ;;
            firefox)
              bash scripts/probe-316/install.sh firefox
              mkdir -p /Applications/Firefox.app/Contents/Resources/distribution
              printf '%s\n' '{"policies":{"DisableAppUpdate":true}}' > /Applications/Firefox.app/Contents/Resources/distribution/policies.json ;;
            *) bash scripts/probe-316/install.sh ;;
          esac
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
          # These apply to the runner's disposable TextEdit control, never the owner's preferences.
          for key in NSAutomaticSpellingCorrectionEnabled NSAutomaticTextReplacementEnabled NSAutomaticQuoteSubstitutionEnabled NSAutomaticDashSubstitutionEnabled NSAutomaticCapitalizationEnabled NSAutomaticPeriodSubstitutionEnabled; do
            defaults write com.apple.TextEdit "$key" -bool NO
            test "$(defaults read com.apple.TextEdit "$key")" = 0
          done
      - name: Build instrumented main, only on runner
        run: |
          git log -1 --format='kit %H %s'
          git worktree add --detach "$RUNNER_TEMP/src" "$ENGINE_REF"
          node scripts/probe-354/patch.mjs "$RUNNER_TEMP/src"
          swift build -c release --package-path "$RUNNER_TEMP/src/native/engine" --scratch-path "$RUNNER_TEMP/build"
          swiftc -O -o "$RUNNER_TEMP/tool354" scripts/probe-354/tool.swift
          swiftc -O -o "$RUNNER_TEMP/ocr354" scripts/probe-354/ocr.swift
      - name: Measure
        env:
          BROWSER: ${{ matrix.browser }}
          PHASE: ${{ matrix.phase }}
          EDITORS: ${{ matrix.editors }}
          SKIP_COMPLETED: ${{ matrix.skip || '' }}
          JOB_ID: ${{ matrix.id }}
          REPS: ${{ github.event.inputs.reps || '20' }}
          SMOKE: ${{ github.event.inputs.smoke || 'false' }}
        run: |
          node scripts/probe-354/measure.mjs --browser "$BROWSER" --phase "$PHASE" --editors "$EDITORS" --skip-completed "$SKIP_COMPLETED" --engine "$RUNNER_TEMP/build/release/cua-engine" --tool "$RUNNER_TEMP/tool354" --ocr "$RUNNER_TEMP/ocr354" --out "$RUNNER_TEMP/probe-354/$JOB_ID" --reps "$REPS" --smoke "$SMOKE"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-354-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/probe-354/**/rows.jsonl
            ${{ runner.temp }}/probe-354/**/calibrations.jsonl
            ${{ runner.temp }}/probe-354/**/config.json
            ${{ runner.temp }}/probe-354/**/progress.json
            ${{ runner.temp }}/probe-354/**/resume-input.json
            ${{ runner.temp }}/probe-354/**/engine-stderr.txt
            ${{ runner.temp }}/probe-354/**/transport.jsonl
            ${{ runner.temp }}/probe-354/**/state-shots/**
            ${{ runner.temp }}/probe-354/**/click-order-setup/**
            ${{ runner.temp }}/probe-354/**/shots/**
          if-no-files-found: warn
