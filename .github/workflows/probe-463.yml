name: probe-463
# Disposable #463 kit (scripts/probe-463/measure.mjs, README section "#463" in scripts/probe-337/README.md): which
# transient UI a background coordinate click opens and route 3's restore closes, one engine head per dispatch, built
# unmodified. A push of this file only registers the workflow on its branch; the hosted macOS run goes on dispatch.
on:
  push:
    branches: ['probe/463-measure']
    paths: ['.github/workflows/probe-463.yml']
  workflow_dispatch:
    inputs:
      engine:
        description: Exact 40-character engine SHA
        required: true
        type: string
      label:
        description: The README's label for this head (main)
        required: true
        type: string
      reps:
        description: Caps every cell's rows (empty keeps each cell's own)
        type: string
        default: ''
      controls:
        description: comma list of controls (te-menubutton, te-context, te-color, cr-appmenu, cr-profile, cr-star, cr-siteinfo, cr-puzzle, cr-tabsearch, cr-context, pg-datalist, pg-date, pg-color); empty runs all
        type: string
        default: ''
      routes:
        description: comma list (click, element, showmenu, kit:AXPress, kit:AXShowMenu); empty runs all
        type: string
        default: ''
      modes:
        description: comma list (shared-behind, dedicated-behind, shared-front); empty runs all
        type: string
        default: ''
      signal:
        description: '#469: dump the closed buttons attributes instead (yes or empty)'
        type: string
        default: ''
      kit:
        description: 'measure (#463) or qual469 (#469 qualification)'
        type: string
        default: measure
permissions:
  contents: read
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Registered; the measurement runs on dispatch with an exact engine SHA.'
  measure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 170
    env:
      ENGINE_SHA: ${{ inputs.engine }}
      LABEL: ${{ inputs.label }}
      REPS: ${{ inputs.reps }}
      CONTROLS: ${{ inputs.controls }}
      ROUTES: ${{ inputs.routes }}
      MODES: ${{ inputs.modes }}
      SIGNAL: ${{ inputs.signal }}
      KIT: ${{ inputs.kit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apps
        run: |
          bash scripts/probe-316/install.sh chrome
          if [ "$KIT" = qual469 ]; then npm ci --prefix scripts/probe-463/electron --no-audit --no-fund; fi
          for d in com.apple.TextEdit com.apple.ScriptEditor2 com.apple.calculator; do
            defaults write "$d" ApplePersistenceIgnoreState -bool YES
            defaults write "$d" NSQuitAlwaysKeepsWindows -bool NO
          done
      - name: Build the engine and the tool
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$ENGINE_SHA^{commit}")" = "$ENGINE_SHA"
          sw_vers
          git log -1 --format='kit %H %s'
          swiftc -O -o "$RUNNER_TEMP/tool463" scripts/probe-463/tool.swift
          git worktree add --detach "$RUNNER_TEMP/src-engine" "$ENGINE_SHA"
          git -C "$RUNNER_TEMP/src-engine" log -1 --format='engine %H %s'
          echo "engine tree status: [$(git -C "$RUNNER_TEMP/src-engine" status --porcelain 2>&1 | head -20)]"
          swift build -c release --package-path "$RUNNER_TEMP/src-engine/native/engine" --scratch-path "$RUNNER_TEMP/eng"
      - name: Measure
        shell: bash
        run: |
          extra=()
          if [ "$KIT" = qual469 ]; then
            if [ -n "$REPS" ]; then extra+=(--reps "$REPS"); fi
            if [ -n "$CONTROLS" ]; then extra+=(--controls "$CONTROLS"); fi
            if [ -n "$MODES" ]; then extra+=(--modes "$MODES"); fi
            P463_ENGINE_REF="$ENGINE_SHA" P463_ENGINE_LABEL="$LABEL" node scripts/probe-463/qual469.mjs --engine "$RUNNER_TEMP/eng/release/cua-engine" \
              --tool "$RUNNER_TEMP/tool463" --out "$RUNNER_TEMP/probe-463" --budget 145 "${extra[@]}"
            node scripts/probe-463/reader469.mjs "$RUNNER_TEMP/probe-463/results.json" | tee "$RUNNER_TEMP/probe-463/summary.txt"
            exit 0
          fi
          if [ -n "$REPS" ]; then extra+=(--reps "$REPS"); fi
          if [ -n "$CONTROLS" ]; then extra+=(--controls "$CONTROLS"); fi
          if [ -n "$ROUTES" ]; then extra+=(--routes "$ROUTES"); fi
          if [ -n "$MODES" ]; then extra+=(--modes "$MODES"); fi
          if [ "$SIGNAL" = yes ]; then extra+=(--signal); fi
          P463_ENGINE_REF="$ENGINE_SHA" P463_ENGINE_LABEL="$LABEL" node scripts/probe-463/measure.mjs --engine "$RUNNER_TEMP/eng/release/cua-engine" \
            --tool "$RUNNER_TEMP/tool463" --out "$RUNNER_TEMP/probe-463" --budget 145 "${extra[@]}"
          if [ "$SIGNAL" = yes ]; then reader=signal-reader.mjs; else reader=reader.mjs; fi
          node "scripts/probe-463/$reader" "$RUNNER_TEMP/probe-463/results.json" | tee "$RUNNER_TEMP/probe-463/summary.txt"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-463-${{ inputs.label }}
          path: |
            ${{ runner.temp }}/probe-463/*.txt
            ${{ runner.temp }}/probe-316/install.txt
            ${{ runner.temp }}/probe-463/results.json
            ${{ runner.temp }}/probe-463/screens/*.jpg
            ${{ runner.temp }}/probe-463/shots/**/*.jpg
            ${{ runner.temp }}/probe-463/shots/**/*.png
          if-no-files-found: warn
