name: probe-389-maws
on:
  push:
    branches: ['probe/389-maws']
    paths: ['.github/workflows/probe-389.yml', 'scripts/probe-389/**']
  workflow_dispatch:
    inputs:
      reps:
        description: 'Repetitions per sequence and operation (10 for full)'
        type: choice
        options: ['2', '10']
        default: '10'
permissions:
  contents: read
concurrency:
  group: probe-389-maws
  cancel-in-progress: false
env:
  ENGINE_REF: 466409bd879191fbdb9aa67b3c9ebe271e153a29
  MAWS_REF: 77af813a4a4a642d747f7511a343448db489a9ab
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      # Topology: pinned MAWS is the workspace root, so its composite setup action runs in its native context
      # (composite run steps do not inherit job defaults.run.working-directory). The kit lives under .cua-probe.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: SSFSKIM/MAWS
          ref: ${{ env.MAWS_REF }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .cua-probe
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          e2e: 'true'
      - name: Build pinned MAWS app
        run: pnpm build:app
      - name: Build unmodified engine and separate logging-only arm
        run: |
          git -C .cua-probe worktree add --detach "$RUNNER_TEMP/main389" "$ENGINE_REF"
          swift build -c release --package-path "$RUNNER_TEMP/main389/native/engine" --scratch-path "$RUNNER_TEMP/build389"
          git -C "$RUNNER_TEMP/main389" diff --exit-code
          node .cua-probe/scripts/probe-389/patch.mjs "$RUNNER_TEMP/main389"
          swift build -c release --package-path "$RUNNER_TEMP/main389/native/engine" --scratch-path "$RUNNER_TEMP/trace389"
          swiftc -O -o "$RUNNER_TEMP/tool389" .cua-probe/scripts/probe-389/tool.swift
          mkdir -p "$RUNNER_TEMP/Probe389 Cover.app/Contents/MacOS"
          cp "$RUNNER_TEMP/tool389" "$RUNNER_TEMP/Probe389 Cover.app/Contents/MacOS/cover389"
          printf '%s' '<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>test.probe389.cover</string><key>CFBundleExecutable</key><string>cover389</string><key>CFBundleName</key><string>Probe389 Cover</string></dict></plist>' > "$RUNNER_TEMP/Probe389 Cover.app/Contents/Info.plist"
          git diff --exit-code
      - name: Probe exact Add project dialog through ordinary engine facade
        env:
          PROBE389_REPS: ${{ inputs.reps || '2' }}
          PROBE389_OUT: ${{ runner.temp }}/evidence389
          PROBE389_KIT: ${{ github.sha }}
        run: |
          cp .cua-probe/scripts/probe-389/probe.spec.ts e2e/probe-389.spec.ts
          pnpm exec playwright test e2e/probe-389.spec.ts --workers=1 --retries=0 --reporter=line
      - name: Upload scratch-owned evidence only
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-389-${{ inputs.reps || '2' }}
          path: ${{ runner.temp }}/evidence389/
          if-no-files-found: warn
