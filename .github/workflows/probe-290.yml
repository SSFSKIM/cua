# #290's hosted re-measurement (scripts/probe-283/ab.mjs, the `long/` cells): a shared-mode coordinate click into a long
# background Chrome for Testing textarea (3,074 and 20,499 characters, scrolled mid-field) behind a frontmost TextEdit,
# origin/main's engine against fix/290-caret-search's, then type_text of a marker; and a dump of each field's character
# boxes for an offline replay through the search (`ax boxes`). Two runners. Runs only on a push to probe/290-measure;
# not a ci-kit gate.
name: probe-290
on:
  push:
    branches: ['probe/290-measure']
permissions:
  contents: read
env:
  P290_BRANCH_REF: 'origin/fix/290-caret-search'
  P290_CELLS: 'long/'
  P290_REPEAT: '3'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build main's engine
        run: |
          sw_vers
          git worktree add "$RUNNER_TEMP/main" origin/main
          echo "P283_MAIN_COMMIT=$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build --package-path "$RUNNER_TEMP/main/native/engine" --scratch-path "$RUNNER_TEMP/eng"
      - name: Build the fix branch's engine
        run: |
          git worktree add "$RUNNER_TEMP/fix" "$P290_BRANCH_REF"
          echo "P283_BRANCH_COMMIT=$(git -C "$RUNNER_TEMP/fix" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build --package-path "$RUNNER_TEMP/fix/native/engine" --scratch-path "$RUNNER_TEMP/eng-fix"
      - name: Build the AX tool
        run: swiftc -o "$RUNNER_TEMP/p283-ax" scripts/probe-283/ax.swift
      - name: A/B
        env:
          P283_REP: ${{ matrix.rep }}
        run: node scripts/probe-283/ab.mjs --main "$RUNNER_TEMP/eng/debug/cua-engine" --branch "$RUNNER_TEMP/eng-fix/debug/cua-engine" --ax "$RUNNER_TEMP/p283-ax" --cells "$P290_CELLS" --repeat "$P290_REPEAT" --out "$RUNNER_TEMP/probe-283"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-290-rep${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/probe-283/*.json
            ${{ runner.temp }}/probe-283/shots-*/**
          if-no-files-found: warn
