name: probe-354-fences
# A/B mode of the already registered spike workflow (historical fence runs remain available).
# Manual only. Preparation pushes must never consume the shared macOS hosted queue.
# Real-engine A/B extension to the #354 spike. No shadow reader or fence patch.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: 'Repetitions per cell (20 for measurement; 10 for isolated diagnostics; 1 for smoke)'
        default: '20'
      smoke:
        description: 'Label smoke evidence separately (set reps to 1)'
        default: 'false'
      only:
        description: 'Comma-separated browser-editor shard ids of the selected cohort, or all'
        default: 'all'
      diagnostic:
        description: 'Cohort: primary, followup, or branch-only firefox-caret / safari-no-key-ax diagnostics (3141f170 pinned)'
        default: 'primary'
permissions:
  contents: read
env:
  MAIN_REF: '9020bb18acb9091f817a4b648f7c332174b11153'
  BRANCH_REF: '3141f1709451ebf77e3b94c5500308d105619f6f'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Refuse an unpinned branch and check pure kit logic
        env:
          REPS: ${{ github.event.inputs.reps }}
          SMOKE: ${{ github.event.inputs.smoke }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic || 'primary' }}
        run: |
          node --input-type=module -e 'import {assertPins} from "./scripts/probe-354-fences/ab-model.mjs"; import {validateRunInputs} from "./scripts/probe-354-fences/caret.mjs"; assertPins(process.env.MAIN_REF, process.env.BRANCH_REF); validateRunInputs({diagnostic:process.env.DIAGNOSTIC,reps:Number(process.env.REPS),smoke:process.env.SMOKE});'
          node --test scripts/probe-354-fences/ab.test.mjs scripts/probe-354-fences/ab-extra.test.mjs scripts/probe-354-fences/ab-secret.test.mjs scripts/probe-354-fences/kit.test.mjs scripts/probe-354-fences/audit-patch.test.mjs scripts/probe-354-fences/offline/ab-table.test.mjs scripts/probe-354-fences/caret.test.mjs scripts/probe-354-fences/caret-patch.test.mjs scripts/probe-354-fences/offline/caret-table.test.mjs scripts/probe-354-fences/followup.test.mjs scripts/probe-354-fences/diagnostic.test.mjs scripts/probe-354-fences/safari-ax.test.mjs scripts/probe-354-fences/safari-ax-source.test.mjs scripts/probe-354-fences/offline/safari-ax-table.test.mjs
      - id: matrix
        env:
          ONLY: ${{ github.event.inputs.only }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic || 'primary' }}
        run: node scripts/probe-354-fences/caret.mjs matrix "$ONLY" "$DIAGNOSTIC" >> "$GITHUB_OUTPUT"
  measure:
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install runner-owned browsers without changing period substitution
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          case "$BROWSER" in
            cft) bash scripts/probe-316/install.sh chrome ;;
            firefox)
              bash scripts/probe-316/install.sh firefox
              mkdir -p /Applications/Firefox.app/Contents/Resources/distribution
              printf '%s\n' '{"policies":{"DisableAppUpdate":true}}' > /Applications/Firefox.app/Contents/Resources/distribution/policies.json ;;
            *) bash scripts/probe-316/install.sh ;;
          esac
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
      - name: Build pinned engines with primary audit or isolated caret tracing
        env:
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic || 'primary' }}
        run: |
          git log -1 --format='kit %H %s'
          mkdir -p "$RUNNER_TEMP/probe-354-ab"
          # Prove the real shim counts internal range-only reads without making any AX requests.
          swiftc -parse-as-library -O -o "$RUNNER_TEMP/audit354-check" scripts/probe-354-fences/audit.swift scripts/probe-354-fences/audit-check.swift
          "$RUNNER_TEMP/audit354-check" 2> "$RUNNER_TEMP/probe-354-ab/audit-controls.jsonl"
          node scripts/probe-354-fences/audit-check.mjs "$RUNNER_TEMP/probe-354-ab/audit-controls.jsonl"
          arms=$(node scripts/probe-354-fences/caret.mjs build-arms "$DIAGNOSTIC")
          for arm in $arms; do
            if [ "$arm" = main ]; then ref="$MAIN_REF"; else ref="$BRANCH_REF"; fi
            git worktree add --detach "$RUNNER_TEMP/$arm-src" "$ref"
            git -C "$RUNNER_TEMP/$arm-src" rev-parse HEAD
            node scripts/probe-354-fences/audit-patch.mjs "$RUNNER_TEMP/$arm-src" > "$RUNNER_TEMP/probe-354-ab/$arm-audit-patch.json"
            if [ "$DIAGNOSTIC" = firefox-caret ]; then
              node scripts/probe-354-fences/caret-patch.mjs "$RUNNER_TEMP/$arm-src" > "$RUNNER_TEMP/probe-354-ab/$arm-caret-patch.json"
            fi
            swift build -c release --package-path "$RUNNER_TEMP/$arm-src/native/engine" --scratch-path "$RUNNER_TEMP/$arm-build"
          done
          swiftc -O -o "$RUNNER_TEMP/side354" scripts/probe-354-fences/side.swift
      - name: Real-engine measurements, one engine process at a time
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
          JOB_ID: ${{ matrix.id }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic || 'primary' }}
          REPS: ${{ github.event.inputs.reps }}
          SMOKE: ${{ github.event.inputs.smoke }}
        run: |
          order=$(node scripts/probe-354-fences/caret.mjs run-arms "$DIAGNOSTIC" "$BROWSER" "$SHARD")
          result=0
          for arm in $order; do
            if [ "$arm" = main ]; then ref="$MAIN_REF"; else ref="$BRANCH_REF"; fi
            out="$RUNNER_TEMP/probe-354-ab/$JOB_ID/$arm"
            code=0
            node scripts/probe-354-fences/ab.mjs --browser "$BROWSER" --shard "$SHARD" --arm "$arm" --head "$ref" --source "$RUNNER_TEMP/$arm-src" --engine "$RUNNER_TEMP/$arm-build/release/cua-engine" --side "$RUNNER_TEMP/side354" --out "$out" --reps "$REPS" --smoke "$SMOKE" --diagnostic "$DIAGNOSTIC" || code=$?
            # A scored contract failure must not suppress the other head. An un-stopped engine must.
            if [ ! -f "$out/engine-stopped.json" ]; then exit 1; fi
            if [ "$code" != 0 ]; then result=1; fi
          done
          if [ "$DIAGNOSTIC" = firefox-caret ]; then
            node scripts/probe-354-fences/offline/caret-table.mjs "$RUNNER_TEMP/probe-354-ab/$JOB_ID"
          elif [ "$DIAGNOSTIC" = safari-no-key-ax ]; then
            node scripts/probe-354-fences/offline/safari-ax-table.mjs "$RUNNER_TEMP/probe-354-ab/$JOB_ID"
          else
            node scripts/probe-354-fences/offline/ab-table.mjs "$RUNNER_TEMP/probe-354-ab/$JOB_ID" --only "$JOB_ID" --cohort "$DIAGNOSTIC"
          fi
          exit "$result"
      - name: Upload rows, incremental tables and provenance
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ github.event.inputs.diagnostic == 'firefox-caret' && 'probe-354-caret' || github.event.inputs.diagnostic == 'safari-no-key-ax' && 'probe-354-safari-ax' || github.event.inputs.diagnostic == 'followup' && 'probe-354-followup' || 'probe-354-ab' }}-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/probe-354-ab/*-audit-patch.json
            ${{ runner.temp }}/probe-354-ab/*-caret-patch.json
            ${{ runner.temp }}/probe-354-ab/audit-controls.jsonl
            ${{ runner.temp }}/probe-354-ab/**/config.json
            ${{ runner.temp }}/probe-354-ab/**/progress.json
            ${{ runner.temp }}/probe-354-ab/**/engine-stopped.json
            ${{ runner.temp }}/probe-354-ab/**/summary.json
            ${{ runner.temp }}/probe-354-ab/**/rows.jsonl
            ${{ runner.temp }}/probe-354-ab/**/caret-rows.jsonl
            ${{ runner.temp }}/probe-354-ab/**/safari-ax-rows.jsonl
            ${{ runner.temp }}/probe-354-ab/**/diagnostic-coverage.json
            ${{ runner.temp }}/probe-354-ab/**/calibrations.jsonl
            ${{ runner.temp }}/probe-354-ab/**/foreground-references.jsonl
            ${{ runner.temp }}/probe-354-ab/**/wrong-successes.jsonl
            ${{ runner.temp }}/probe-354-ab/**/*.tsv
            ${{ runner.temp }}/probe-354-ab/**/engine-stderr.txt
            ${{ runner.temp }}/probe-316/install.txt
          if-no-files-found: warn
