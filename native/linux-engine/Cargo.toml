[package]
name = "cua-linux-engine"
# M1b's first release was linux-engine-v0.1.0, M2's is 0.2.0; each later release takes the next minor
# (docs/doperpowers/specs/2026-10-28-own-linux-engine-design.md, Interfaces and Dependencies). The release workflow
# (.github/workflows/linux-engine.yml) builds the version named here and refuses one already released.
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "cua's own Linux native engine (#171): AT-SPI and X11 behind the vendor helper's wire"

[[bin]]
name = "cua-engine"
path = "src/main.rs"

# Only crates OpenAI's sky_linux links (R/A §2.2; the owner's 2026-10-28 ruling), at those versions or later
# compatible releases. The version the vendor shipped is noted beside each.
[dependencies]
anyhow = "1.0.102"                                                  # vendor: anyhow 1.0.102
serde = { version = "1.0.228", features = ["derive"] }              # vendor: serde 1.0.228 (serde_core 1.0.228)
serde_json = "1.0.149"                                              # vendor: serde_json 1.0.149
# xinput: the drag's pointer watch (`stray.rs`), a feature of the same crate, no new package
x11rb = { version = "0.13.2", features = ["composite", "damage", "xtest", "xfixes", "render", "shm", "xinput"] } # vendor: x11rb 0.13.2
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }        # vendor: image 0.25.10
# x11rb's own dependency, named for the desktop screenshot's MIT-SHM segment (memfd and mmap), with `runtime` the
# server loop's stop signals (`serve.rs`: rt_sigprocmask and rt_sigtimedwait, M4's T7), and with `process` and `event`
# the REPL host's launcher shim (`shim.rs`: prctl's parent-death signal, getppid, pidfds and poll, M4 T7b): no new
# package, no lockfile change
rustix = { version = "1.1.4", features = ["event", "fs", "mm", "process", "runtime"] }            # vendor: rustix 1.1.4

[dev-dependencies]
# For the live tests alone, never in the binary: features of crates the engine already links, no new package. They
# find the after-release watch's connection from outside a shipped binary and cut it: x11rb's res (X-Resource) lists
# the engine's X clients by its process id; rustix's process and net take the socket (pidfd_getfd) and shut it down.
x11rb = { version = "0.13.2", features = ["res"] }
rustix = { version = "1.1.4", features = ["process", "net"] }

[features]
# Tests that need an X display with Composite, DAMAGE and MIT-SHM, an accessibility bus, and yad (a GTK 3 window):
# the engine-linux gate and the release workflow run them under `xvfb-run -a dbus-run-session`.
live = []

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
