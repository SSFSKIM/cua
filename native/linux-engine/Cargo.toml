[package]
name = "cua-linux-engine"
# M1b's first release, linux-engine-v0.1.0; each later release takes the next minor
# (docs/doperpowers/specs/2026-10-28-own-linux-engine-design.md, Interfaces and Dependencies). The release workflow
# (.github/workflows/linux-engine.yml) builds the version named here and refuses one already released.
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "cua's own Linux native engine (#171): AT-SPI and X11 behind the vendor helper's wire"

[[bin]]
name = "cua-engine"
path = "src/main.rs"

# Only crates OpenAI's sky_linux links (R/A §2.2; the owner's 2026-10-28 ruling), at those versions or later
# compatible releases. The version the vendor shipped is noted beside each.
[dependencies]
anyhow = "1.0.102"                                                  # vendor: anyhow 1.0.102
serde = { version = "1.0.228", features = ["derive"] }              # vendor: serde 1.0.228 (serde_core 1.0.228)
serde_json = "1.0.149"                                              # vendor: serde_json 1.0.149
x11rb = { version = "0.13.2", features = ["composite", "damage", "xtest", "xfixes", "render", "shm"] } # vendor: x11rb 0.13.2
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }        # vendor: image 0.25.10
# x11rb's own dependency, named for the desktop screenshot's MIT-SHM segment (memfd and mmap): no new package
rustix = { version = "1.1.4", features = ["fs", "mm"] }                                # vendor: rustix 1.1.4

[features]
# Tests that need an X display with Composite, DAMAGE and MIT-SHM, an accessibility bus, and yad (a GTK 3 window):
# the engine-linux gate and the release workflow run them under `xvfb-run -a dbus-run-session`.
live = []

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
