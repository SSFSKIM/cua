name: probe-117-h0
# Disposable #117 H0 spike (#175; scripts/probe-117-h0/README.md). A push of this file only registers the workflow on its
# branch. `full` runs the kit on a hosted macOS runner: main's engine bundle, the vendor's helper and the scenes, then
# TCC rows written by the kit's one guarded writer (O0, ruling 1111: GitHub-hosted runners only). `label` only reports
# what a runner label gives (step 5). Policy: the TCC writer refuses unless RUNNER_ENVIRONMENT=github-hosted and the
# owner's yes is in the spec's Decision Log; no secret is used.
on:
  push:
    branches: ['probe/117-h0']
    paths: ['.github/workflows/probe-117-h0.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: full (the kit), alert (ruling 1135 (ii), the capture confirmation observed only) or label (sw_vers on the runner label only)
        type: choice
        options: [full, alert, label]
        default: full
      runner:
        description: Runner label (macos-latest, macos-26, macos-27, xcode-27, ...)
        type: string
        default: macos-latest
      prebuild:
        description: yes builds the engine bundle on macos-latest (main's `cua engine build --sign adhoc`) and places it on the kit's runner first; for an image whose toolchain cannot build it (xcode-27)
        type: choice
        options: ['no', 'yes']
        default: 'no'
permissions:
  contents: read
concurrency:
  group: probe-117-h0-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Registered; dispatch with mode and runner.'
  label:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'label'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - run: |
          echo "label=${{ inputs.runner }} ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m) env=$RUNNER_ENVIRONMENT"
          sw_vers
          system_profiler SPDisplaysDataType | sed -n '/Displays:/,$p' | head -20
  prebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'label' && inputs.prebuild == 'yes'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - shell: bash
        run: |
          set -euo pipefail
          sw_vers; xcrun swift --version
          node bin/cua.mjs engine build --sign adhoc --json
          tar -C "$HOME/Library/Application Support/cua" -czf "$RUNNER_TEMP/h0-engine.tgz" "engine/cua Engine.app" engine/pending.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-117-h0-engine
          path: ${{ runner.temp }}/h0-engine.tgz
          retention-days: 7
  full:
    needs: prebuild
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode != 'label' && (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    env:
      H0_LABEL: ${{ inputs.runner }}
      H0_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - if: inputs.prebuild == 'yes'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-117-h0-engine
          path: ${{ runner.temp }}/h0-engine
      - name: Place the prebuilt engine at the approved location
        if: inputs.prebuild == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Application Support/cua"
          tar -C "$HOME/Library/Application Support/cua" -xzf "$RUNNER_TEMP/h0-engine/h0-engine.tgz"
          codesign --verify --strict "$HOME/Library/Application Support/cua/engine/cua Engine.app"
      - name: Prerequisites (npm ci, the display tool)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git log -1 --format='kit %H %s'
          echo "main $(git merge-base HEAD origin/main)"
          sw_vers; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m)"
          npm ci --no-audit --no-fund
          swiftc -O scripts/probe-117-h0/display.swift -o "$RUNNER_TEMP/h0-display"
          swiftc -O scripts/probe-117-h0/alert-windows.swift -o "$RUNNER_TEMP/h0-alert-windows"
      - name: The loopback device (a user-mode sshd, as scripts/repl-parity/hosted/hosted.sh sets it up)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          SSHD="$RUNNER_TEMP/h0-sshd"; mkdir -p "$SSHD" "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$SSHD/hostkey"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/h0"
          cat "$HOME/.ssh/h0.pub" >> "$HOME/.ssh/authorized_keys"; chmod 600 "$HOME/.ssh/authorized_keys"
          echo "PATH=$PATH" > "$HOME/.ssh/environment"
          printf "export PATH='%s'\n" "$PATH" >> "$HOME/.bashrc"
          cat > "$SSHD/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $SSHD/hostkey
          PidFile $SSHD/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          PermitUserEnvironment yes
          EOF
          cat >> "$HOME/.ssh/config" <<EOF
          Host hosted-macos
            HostName 127.0.0.1
            Port 2222
            User $USER
            IdentityFile $HOME/.ssh/h0
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          /usr/sbin/sshd -f "$SSHD/sshd_config" -E "$SSHD/sshd.log"
          sleep 1
          test "$(ssh -o BatchMode=yes hosted-macos 'node -v')" = "$(node -v)"
      - name: The kit (steps 1 to 4 and 6 without TCC writes, then 7 to 10 with them)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h0"
          node scripts/probe-117-h0/kit.mjs "$RUNNER_TEMP/h0" "$RUNNER_TEMP/h0-cua-home" "$RUNNER_TEMP/h0-scenes" "$RUNNER_TEMP/h0-display"
      - name: Upload the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-117-h0-${{ inputs.runner }}
          path: ${{ runner.temp }}/h0/
          if-no-files-found: error
          retention-days: 30
