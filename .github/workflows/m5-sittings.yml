name: m5-sittings
# #117 M5's hosted sittings (T10b′; docs/evidence/2026-11-23-own-native-engine/hosted.md): one job per sitting, A to F,
# each on one GitHub-hosted macOS runner with both engines, lanes alternating (scripts/hosted-sittings.mjs). Dispatch
# only: a push of this file just registers it on its branch. `pilot` runs every sitting once in its smallest form, the
# first hosted run after M4 merges. The engine is built on macos-latest and copied to each sitting's runner until #504
# lets the xcode-27 image build it; sitting E builds and approves its own (macos-default-selection-hosted.sh), so it
# always runs on macos-latest. By default C runs on xcode-27 (macOS 27) and A, B, D and F on macos-latest; `image`
# overrides that for all but E. TCC rows are written only by the kit's one guarded writer (scripts/hosted-sittings/tcc.mjs),
# which refuses unless RUNNER_ENVIRONMENT=github-hosted and the O0 entry is in the Decision Log (ruling 1111). No repository
# secret is used; replayd's store is never written (ruling 1141). Each job uploads its output, whatever its result.
# form=split (sitting c, ruling 1228): one job per run number (split_runs; filter for a filtered rerun over the full run
# base_run_id names, or with no base_run_id a proof run whose cells are judged alone, ruling 1248), then a judging job
# that refuses jobs of another harness commit or engine version (split.mjs).
# jobs_run_id (ruling 1234): a judge-only dispatch, the judging job alone over the run jobs of that earlier run (its
# attempt and drawing commit pinned by jobs_run_attempt and jobs_commit), refused unless they check out (source-run).
on:
  push:
    branches: ['feat/117-m5']
    paths: ['.github/workflows/m5-sittings.yml']
  workflow_dispatch:
    inputs:
      sitting:
        description: The sitting (a to f), or all for one job each
        type: choice
        options: [all, a, b, c, d, e, f]
        default: all
      form:
        description: "full; pilot (every sitting once, its smallest form, with the pilot's readings); or split (sitting c only: one job per run number, then a judging job)"
        type: choice
        options: [full, pilot, split]
        default: full
      split_runs:
        description: "split: the run numbers to run, one job each, comma-separated (e.g. 1,2,3, or 2 for a rerun after a recorded stop; spaces are stripped, nothing else is taken)"
        type: string
        default: '1,2,3'
      filter:
        description: "split: the cells a filtered rerun needs, comma-separated (empty: every cell; textedit/intervention.saveSheet for #212's)"
        type: string
        default: ''
      base_run_id:
        description: "split with a filter: the run id of the full sitting C whose records lie beneath the filtered reruns (e.g. 45468052791), then, comma-separated, each judged split run whose run jobs are layered over it in order (ruling 1239; e.g. 45468052791,46069842660); empty with a filter: a proof run (ruling 1248), its cells judged pairwise on its own runs alone"
        type: string
        default: ''
      jobs_run_id:
        description: "split, judge only (ruling 1234): the run id whose run jobs to judge without re-running them (empty: run them in this dispatch); runs, filter, base_run_id and speed_extra must be that run's"
        type: string
        default: ''
      jobs_run_attempt:
        description: "split, judge only: the attempt of jobs_run_id judged (its latest; the judge refuses another)"
        type: string
        default: ''
      jobs_commit:
        description: "split, judge only: the full harness commit the run jobs drew at (the judge refuses records of another)"
        type: string
        default: ''
      speed_extra:
        description: "split: each run job also re-times the three speed ops full sitting C missed, ten samples each on both lanes (about 10 min), and three narrow base passes as controls; the judge judges the three on these samples alone, the base shown beside them, and reports the controls unjudged"
        type: boolean
        default: false
      image:
        description: "The sittings' runner: default puts C on xcode-27 (macOS 27) and A, B, D, F on macos-latest; the builder and E always take macos-latest"
        type: choice
        options: [default, macos-latest, xcode-27]
        default: default
      flipped:
        description: This commit selects cua's engine by default on macOS (sitting E's lanes are then expected to pass)
        type: boolean
        default: false
      decision_commit:
        description: "The full commit of the design spec whose Decision Log holds the owner's O0 entry (empty: the entry's own, db775127652ebae5e0c7d90b5f5e2785f8e5711e on docs/117-progress; any other must be reachable from docs/117-progress)"
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: m5-sittings-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Registered; dispatch with sitting, form, image and flipped.'
  # form=split is sitting C's alone: any other sitting is refused, never silently run as nothing.
  split_refused:
    if: github.event_name == 'workflow_dispatch' && inputs.form == 'split' && inputs.sitting != 'c'
    runs-on: ubuntu-latest
    steps:
      - name: Prerequisites
        env:
          SITTING: ${{ inputs.sitting }}
        run: |
          echo "form=split splits sitting c only, not $SITTING"
          exit 2
  engine:
    if: github.event_name == 'workflow_dispatch' && inputs.sitting != 'e' && inputs.sitting != 'f'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build the run's engine (ad hoc, CI only) and pack its directory
        shell: bash
        run: |
          set -euo pipefail
          sw_vers; xcrun swift --version
          node bin/cua.mjs engine build --sign adhoc --json
          # The engine directory as the build left it (M4: the pending slot; before it, the bundle and pending.json),
          # without the Swift build's scratch.
          tar -C "$HOME/Library/Application Support/cua" --exclude engine/build --exclude engine/staging -czf "$RUNNER_TEMP/m5-engine.tgz" engine
          tar -tzf "$RUNNER_TEMP/m5-engine.tgz" | grep -v '/Contents/.'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: m5-sittings-engine
          path: ${{ runner.temp }}/m5-engine.tgz
          retention-days: 7
  sitting:
    needs: engine
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.form != 'split' && (needs.engine.result == 'success' || needs.engine.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        sitting: ${{ fromJSON(inputs.sitting == 'all' && '["a","b","c","d","e","f"]' || format('["{0}"]', inputs.sitting)) }}
    runs-on: ${{ matrix.sitting == 'e' && 'macos-latest' || (inputs.image == 'default' && (matrix.sitting == 'c' && 'xcode-27' || 'macos-latest')) || inputs.image }}
    timeout-minutes: 360
    env:
      SITTING: ${{ matrix.sitting }}
      FORM: ${{ inputs.form }}
      FLIPPED: ${{ inputs.flipped }}
    steps:
      # The job's start, first, so every report's wall time counts the whole job against its limit (run.mjs JOB_LIMIT_MINUTES).
      - name: Job start
        shell: bash
        run: echo "M5_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git log -1 --format='sitting %H %s'
          sw_vers; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m) sitting=$SITTING form=$FORM flipped=$FLIPPED"
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/m5-out"
      # The TCC writer reads only this file: the design spec at one pinned commit, fetched here, never by the writer.
      - name: Pin the O0 source for the TCC writer
        if: matrix.sitting != 'f'
        shell: bash
        env:
          DECISION_COMMIT: ${{ inputs.decision_commit }}
        run: |
          set -euo pipefail
          node scripts/hosted-sittings.mjs pin-decision ${DECISION_COMMIT:+--commit "$DECISION_COMMIT"} --env-file "$GITHUB_ENV" | tee "$RUNNER_TEMP/m5-out/decision-pin.txt"
      - if: contains(fromJSON('["a","b","c","d"]'), matrix.sitting)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m5-sittings-engine
          path: ${{ runner.temp }}/m5-engine
      - name: The runner's setup (loopback device, install, engine, TCC rows, relaunch, two-pass approve, record)
        if: contains(fromJSON('["a","b","c","d"]'), matrix.sitting)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosted-sittings.mjs setup --engine-archive "$RUNNER_TEMP/m5-engine/m5-engine.tgz" --report "$RUNNER_TEMP/m5-out/setup.json"
      - name: The sitting
        shell: bash
        run: |
          set -uo pipefail
          flags=()
          [ "$FORM" = pilot ] && flags+=(--pilot)
          [ "$FLIPPED" = true ] && flags+=(--flipped)
          code=0
          node scripts/hosted-sittings.mjs run "$SITTING" --out "$RUNNER_TEMP/m5-out/sitting" ${flags[@]+"${flags[@]}"} || code=$?
          [ -f "$RUNNER_TEMP/m5-out/sitting/sitting.md" ] && cat "$RUNNER_TEMP/m5-out/sitting/sitting.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: m5-sitting-${{ matrix.sitting }}-${{ inputs.form }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-out
          retention-days: 14
          if-no-files-found: warn
  # Ruling 1228 (E): sitting C split into one job per run number, each its own runner (setup, witness tap, its run's
  # vendor/cua pair in the lane order v/c/v by job, its run's save-sheet steps), then a judging job. A run job is re-run
  # ("Re-run failed jobs") only after a recorded infrastructure or harness stop; each attempt uploads its own artifact,
  # and the judge lists them all and takes each run's latest.
  split_run:
    needs: engine
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.form == 'split' && inputs.sitting == 'c' && inputs.jobs_run_id == '' && needs.engine.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(format('[{0}]', inputs.split_runs)) }}
    runs-on: ${{ inputs.image == 'default' && 'xcode-27' || inputs.image }}
    timeout-minutes: 360
    env:
      RUN: ${{ matrix.run }}
      FILTER: ${{ inputs.filter }}
      BASE_RUN_ID: ${{ inputs.base_run_id }}
      SPEED_EXTRA: ${{ inputs.speed_extra }}
    steps:
      - name: Job start
        shell: bash
        run: echo "M5_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # A filtered rerun names the full run beneath it (base_run_id); one that names none is a proof run (ruling 1248).
          git log -1 --format='sitting %H %s'
          sw_vers; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m) run=$RUN filter=$FILTER"
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/m5-out"
      - name: The runner's hardware, for the judge's record of each job
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # the script is JavaScript, its ${} the template's
          node -e 'const {execFileSync: x} = require("node:child_process"), s = k => x("sysctl", ["-n", k], {encoding: "utf8"}).trim();
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify({model: s("hw.model"), cpu: s("machdep.cpu.brand_string"), cpus: Number(s("hw.ncpu")),
              memoryGB: Math.round(Number(s("hw.memsize")) / 2 ** 30), macOS: x("sw_vers", ["-productVersion"], {encoding: "utf8"}).trim(),
              image: `${process.env.ImageOS} ${process.env.ImageVersion}`}, null, 2) + "\n")' "$RUNNER_TEMP/m5-out/hardware.json"
          cat "$RUNNER_TEMP/m5-out/hardware.json"
      - name: Pin the O0 source for the TCC writer
        shell: bash
        env:
          DECISION_COMMIT: ${{ inputs.decision_commit }}
        run: |
          set -euo pipefail
          node scripts/hosted-sittings.mjs pin-decision ${DECISION_COMMIT:+--commit "$DECISION_COMMIT"} --env-file "$GITHUB_ENV" | tee "$RUNNER_TEMP/m5-out/decision-pin.txt"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m5-sittings-engine
          path: ${{ runner.temp }}/m5-engine
      - name: The runner's setup (loopback device, install, engine, TCC rows, relaunch, two-pass approve, record)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosted-sittings.mjs setup --engine-archive "$RUNNER_TEMP/m5-engine/m5-engine.tgz" --report "$RUNNER_TEMP/m5-out/setup.json"
      - name: The run job
        shell: bash
        run: |
          set -uo pipefail
          flags=(--split-run "$RUN")
          [ -n "$FILTER" ] && flags+=(--only "$FILTER")
          [ "$SPEED_EXTRA" = true ] && flags+=(--speed-extra)
          code=0
          node scripts/hosted-sittings.mjs run c --out "$RUNNER_TEMP/m5-out/sitting" "${flags[@]}" || code=$?
          [ -f "$RUNNER_TEMP/m5-out/sitting/sitting.md" ] && cat "$RUNNER_TEMP/m5-out/sitting/sitting.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: m5-sitting-c-run-${{ matrix.run }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-out
          retention-days: 14
          if-no-files-found: warn
  # The judging job: every run job's artifact (each attempt listed, each run's latest judged), a full run's beneath
  # filtered reruns, refused when the jobs differ in harness commit or engine version; then the judge and key-route.
  # A run job fails only on a harness or infrastructure stop (its verdicts ride in its artifact), so the judge runs
  # whenever the run jobs ended, on each run's artifact; one missing fails it closed. The base (a filtered rerun's) is the
  # committed evidence directory whose README names base_run_id, checked against its digests before it is read (H1).
  # A judge-only dispatch (jobs_run_id, ruling 1234) skips split_run (!cancelled() keeps this job running) and reads the
  # run jobs' artifacts of that run, checked against the API and the pin before anything is judged.
  split_judge:
    needs: [engine, split_run]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.form == 'split' && inputs.sitting == 'c' && needs.engine.result == 'success' }}
    runs-on: ${{ inputs.image == 'default' && 'xcode-27' || inputs.image }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      SPLIT_RUNS: ${{ inputs.split_runs }}
      FILTER: ${{ inputs.filter }}
      BASE_RUN_ID: ${{ inputs.base_run_id }}
      SPEED_EXTRA: ${{ inputs.speed_extra }}
      JOBS_RUN_ID: ${{ inputs.jobs_run_id }}
      JOBS_RUN_ATTEMPT: ${{ inputs.jobs_run_attempt }}
      JOBS_COMMIT: ${{ inputs.jobs_commit }}
    steps:
      - name: Job start
        shell: bash
        run: echo "M5_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git log -1 --format='judge %H %s'
          # The run numbers once, spaces stripped, for every step after this one (the judge's --runs takes them so).
          runs=${SPLIT_RUNS//[[:space:]]/}
          [[ "$runs" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "split_runs is run numbers, comma-separated (e.g. 1,2,3), not '$SPLIT_RUNS'"; exit 2; }
          echo "M5_RUNS=$runs" >> "$GITHUB_ENV"
          # A judge-only dispatch names its source run's id, attempt and drawing commit, all three; none of them otherwise.
          if [ -n "$JOBS_RUN_ID" ]; then
            [[ "$JOBS_RUN_ID" =~ ^[0-9]+$ && "$JOBS_RUN_ATTEMPT" =~ ^[0-9]+$ && "$JOBS_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "jobs_run_id needs jobs_run_attempt and jobs_commit (the full sha): '$JOBS_RUN_ID' '$JOBS_RUN_ATTEMPT' '$JOBS_COMMIT'"; exit 2; }
          elif [ -n "$JOBS_RUN_ATTEMPT$JOBS_COMMIT" ]; then
            echo 'jobs_run_attempt and jobs_commit belong to a judge-only dispatch (jobs_run_id)'; exit 2
          fi
          sw_vers; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m) runs=$runs base=$BASE_RUN_ID"
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/m5-out"
      - if: inputs.jobs_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: m5-sitting-c-run-*
          path: ${{ runner.temp }}/m5-jobs
      # A judge-only dispatch: the run jobs' artifacts of the source run, every attempt, as the source-run step checks them.
      - if: inputs.jobs_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: m5-sitting-c-run-*
          path: ${{ runner.temp }}/m5-jobs
          run-id: ${{ inputs.jobs_run_id }}
          github-token: ${{ github.token }}
      - name: The run jobs (every attempt listed, each run's latest judged)
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2012 # the artifact names are ours: m5-sitting-c-<run|full>-<n>-<attempt>
          latest() { ls -d "$1"-* 2>/dev/null | awk -F- '{print $NF" "$0}' | sort -n | tail -1 | cut -d' ' -f2-; }
          mkdir -p "$RUNNER_TEMP/m5-out/sitting"
          { echo '## Run job attempts (every one found; the latest of each run judged)'; echo; for d in "$RUNNER_TEMP"/m5-jobs/*; do echo "- ${d##*/}"; done; } \
            | tee "$RUNNER_TEMP/m5-out/sitting/attempts.md" >> "$GITHUB_STEP_SUMMARY"
          jobs=()
          for run in ${M5_RUNS//,/ }; do
            dir=$(latest "$RUNNER_TEMP/m5-jobs/m5-sitting-c-run-$run") || true
            [ -n "$dir" ] || { echo "no artifact of run job $run"; exit 1; }
            jobs+=("$dir/sitting")
          done
          echo "M5_JOBS=$(IFS=,; echo "${jobs[*]}")" >> "$GITHUB_ENV"
          if [ -n "$BASE_RUN_ID" ]; then
            # The base's layers in order (ruling 1239): the full run, then each judged split run whose run jobs lie over it.
            # Each is the committed directory whose README names its run; jobs-check verifies their digests and READMEs again.
            # Exactly one committed directory may name a run: two would leave the layer the judge reads a guess.
            # A read loop: a macOS runner's bash is 3.2, without bash 4's array builtins.
            ids=${BASE_RUN_ID//[[:space:]]/}
            [[ "$ids" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "base_run_id is run ids, comma-separated, the full run first, not '$BASE_RUN_ID'"; exit 2; }
            bases=()
            for id in ${ids//,/ }; do
              readmes=()
              while IFS= read -r f; do readmes+=("$f"); done < <(grep -l "actions/runs/$id)" docs/evidence/*/README.md || true)
              [ "${#readmes[@]}" -eq 1 ] || { echo "${#readmes[@]} committed bases name run $id (${readmes[*]:-none}): exactly one must"; exit 1; }
              dir=$(dirname "${readmes[0]}")
              [ -f "$dir/digests.sha256" ] || { echo "$dir has no digests.sha256"; exit 1; }
              bases+=("$dir")
            done
            echo "M5_BASE=$(IFS=,; echo "${bases[*]}")" >> "$GITHUB_ENV"
            echo "M5_BASE_RUN_ID=$ids" >> "$GITHUB_ENV"
          fi
      # Ruling 1234: the source run of a judge-only dispatch, from the API, against the pin and this dispatch's inputs,
      # before anything is judged; its section rides in sitting.md (source-run.json beside the judge's report).
      - name: The source run (a judge-only dispatch)
        if: inputs.jobs_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs/$JOBS_RUN_ID" src="$RUNNER_TEMP/m5-source"
          mkdir -p "$src"
          gh api "$api" > "$src/run.json"
          gh api --paginate --slurp "$api/jobs?filter=all&per_page=100" > "$src/jobs.json"
          gh api --paginate --slurp "$api/artifacts?per_page=100" > "$src/artifacts.json"
          git cat-file -e "$JOBS_COMMIT^{commit}" 2>/dev/null || git fetch --no-tags origin "$JOBS_COMMIT"
          flags=()
          [ "$SPEED_EXTRA" = true ] && flags+=(--speed-extra)
          code=0
          node scripts/hosted-sittings.mjs source-run --jobs "$M5_JOBS" --source "$src" --run-id "$JOBS_RUN_ID" --attempt "$JOBS_RUN_ATTEMPT" --commit "$JOBS_COMMIT" \
            --repo "$GITHUB_REPOSITORY" --runs "$M5_RUNS" --only "$FILTER" ${flags[@]+"${flags[@]}"} --out "$RUNNER_TEMP/m5-out/sitting/source-run.json" | tee -a "$GITHUB_STEP_SUMMARY" || code=$?
          exit $code
      - name: Pin the O0 source for the TCC writer
        shell: bash
        env:
          DECISION_COMMIT: ${{ inputs.decision_commit }}
        run: |
          set -euo pipefail
          node scripts/hosted-sittings.mjs pin-decision ${DECISION_COMMIT:+--commit "$DECISION_COMMIT"} --env-file "$GITHUB_ENV" | tee "$RUNNER_TEMP/m5-out/decision-pin.txt"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m5-sittings-engine
          path: ${{ runner.temp }}/m5-engine
      - name: The runner's setup (loopback device, install, engine, TCC rows, relaunch, two-pass approve, record)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosted-sittings.mjs setup --engine-archive "$RUNNER_TEMP/m5-engine/m5-engine.tgz" --report "$RUNNER_TEMP/m5-out/setup.json"
      - name: The judge
        shell: bash
        run: |
          set -uo pipefail
          flags=(--split-judge --jobs "$M5_JOBS" --runs "$M5_RUNS")
          [ -n "${M5_BASE:-}" ] && flags+=(--base "$M5_BASE" --base-run-id "$M5_BASE_RUN_ID")
          [ -n "$FILTER" ] && flags+=(--only "$FILTER")
          code=0
          node scripts/hosted-sittings.mjs run c --out "$RUNNER_TEMP/m5-out/sitting" "${flags[@]}" || code=$?
          [ -f "$RUNNER_TEMP/m5-out/sitting/sitting.md" ] && cat "$RUNNER_TEMP/m5-out/sitting/sitting.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: m5-sitting-c-judge-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-out
          retention-days: 14
          if-no-files-found: warn
