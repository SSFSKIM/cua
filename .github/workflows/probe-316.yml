# #316's hosted kit. The sequence groups (safari, chrome, firefox, native) run a sequence a model sends, then a
# coordinate click placed in the screenshot taken before it, and read where each click landed and what a narrower
# detector could have read at click time (ruling cb252e88's measure-first spike). The sweep-* groups are the still-page
# gate (ruling 4701abd8): live coordinate clicks on unchanged pages and apps, frames included, with no key and no
# navigation, which W and G must never refuse. Each job builds the engine at every head named in `heads`
# (label=ref, comma-separated; one engine process alive at a time, the heads measured one after the other) and runs
# scripts/probe-316/measure.mjs once per head. Runs only on a push to probe/316-measure (or by hand); not a ci-kit gate.
name: probe-316
on:
  push:
    branches: ['probe/316-measure']
    paths-ignore: ['scripts/probe-316/offline/**', 'docs/**']
  workflow_dispatch:
    inputs:
      groups:
        description: the groups, a JSON list (safari, chrome, firefox, native, sweep-safari, sweep-chrome, sweep-firefox, sweep-native)
        required: false
        default: ''
      heads:
        description: the engine heads, label=ref comma-separated (empty for the push default)
        required: false
        default: ''
      reps:
        description: repetitions per cell
        required: false
        default: '1'
      only:
        description: the sequences (comma list; empty for all)
        required: false
        default: ''
permissions:
  contents: read
env:
  # Quoted: YAML reads an all-digit-and-e SHA as a float. main after #329.
  # The A/B (ruling 4701abd8): main against fix/316-overlay-guard's head.
  P316_HEADS_DEFAULT: 'main=73b44561d82d80202fcfa056d862f70defffd993,branch=ca4652a7e96fb58fc9853ddfd6ee4a37820cea5f'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # A push runs the groups named here.
        group: ${{ fromJSON(github.event.inputs.groups || '["sweep-safari", "sweep-chrome", "sweep-firefox", "sweep-native", "safari", "chrome", "firefox", "native"]') }}
    runs-on: macos-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apps
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            chrome|sweep-chrome) bash scripts/probe-316/install.sh chrome ;;
            firefox|sweep-firefox)
              bash scripts/probe-316/install.sh firefox
              # Firefox's "Update available" panel covered the frames page in run 42504762481: no update checks.
              mkdir -p /Applications/Firefox.app/Contents/Resources/distribution
              printf '%s\n' '{"policies": {"DisableAppUpdate": true}}' > /Applications/Firefox.app/Contents/Resources/distribution/policies.json ;;
            *) bash scripts/probe-316/install.sh ;;
          esac
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
      - name: Build the engine heads and the tool
        env:
          HEADS: ${{ github.event.inputs.heads || env.P316_HEADS_DEFAULT }}
        run: |
          sw_vers
          git log -1 --format='kit %H %s'
          swiftc -O -o "$RUNNER_TEMP/tool316" scripts/probe-316/tool.swift
          for spec in ${HEADS//,/ }; do
            label="${spec%%=*}"; ref="${spec#*=}"
            git worktree add --detach "$RUNNER_TEMP/src-$label" "$ref"
            git -C "$RUNNER_TEMP/src-$label" log -1 --format="$label %H %s"
            swift build -c release --package-path "$RUNNER_TEMP/src-$label/native/engine" --scratch-path "$RUNNER_TEMP/eng-$label"
          done
      - name: Measure
        env:
          GROUP: ${{ matrix.group }}
          HEADS: ${{ github.event.inputs.heads || env.P316_HEADS_DEFAULT }}
          REPS: ${{ github.event.inputs.reps || '1' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: |
          extra=()
          if [ -n "$ONLY" ]; then extra=(--only "$ONLY"); fi
          specs=(${HEADS//,/ })
          budget=$(( 150 / ${#specs[@]} ))
          for spec in "${specs[@]}"; do
            label="${spec%%=*}"
            echo "== $(date -u +%H:%M:%S) head $label"
            P316_HEAD="$label" P316_ENGINE_REF="$(git -C "$RUNNER_TEMP/src-$label" rev-parse HEAD)" \
              node scripts/probe-316/measure.mjs --group "$GROUP" --engine "$RUNNER_TEMP/eng-$label/release/cua-engine" --tool "$RUNNER_TEMP/tool316" \
              --out "$RUNNER_TEMP/probe-316/$GROUP/$label" --reps "$REPS" --budget "$budget" "${extra[@]}"
          done
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-316-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/probe-316/*.txt
            ${{ runner.temp }}/probe-316/**/results.json
            ${{ runner.temp }}/probe-316/**/screens/*.jpg
            ${{ runner.temp }}/probe-316/**/shots/**/*.jpg
            ${{ runner.temp }}/probe-316/**/shots/**/*.png
          if-no-files-found: warn
