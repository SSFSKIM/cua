# #282's hosted probe (scripts/probe-282/probe.mjs): whether a hosted macOS runner gives cua's own engine the
# Accessibility and event-posting grants and delivers a route-3 click into a background Chrome for Testing page. Runs
# only on a push to probe/282-hosted; not a ci-kit gate.
name: probe-282
on:
  push:
    branches: [probe/282-hosted]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TCC rows for the services the engine needs
        run: |
          sw_vers
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceScreenCapture','kTCCServiceListenEvent') order by service, client" || true
          done
          ps -o pid,ppid,comm -p $$ -p $PPID
          ps -axo pid,ppid,comm | grep -iE "hosted-compute|Runner\.(Listener|Worker)|provisioner" | grep -v grep || true
      - name: Build this branch's engine
        run: swift build --package-path native/engine --scratch-path "$RUNNER_TEMP/eng-branch"
      - name: Build origin/main's engine
        run: |
          git worktree add "$RUNNER_TEMP/main" origin/main
          git -C "$RUNNER_TEMP/main" log --oneline -1
          swift build --package-path "$RUNNER_TEMP/main/native/engine" --scratch-path "$RUNNER_TEMP/eng-main"
      - name: Probe
        run: node scripts/probe-282/probe.mjs --main "$RUNNER_TEMP/eng-main/debug/cua-engine" --branch "$RUNNER_TEMP/eng-branch/debug/cua-engine" --out "$RUNNER_TEMP/probe-282"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-282
          path: |
            ${{ runner.temp }}/probe-282/*.json
            ${{ runner.temp }}/probe-282/*.png
            ${{ runner.temp }}/probe-282/shots-*/**
          if-no-files-found: warn
