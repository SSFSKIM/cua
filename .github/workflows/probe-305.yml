# #305's live check (scripts/probe-305/live.mjs): origin/main's engine (c4057c3a), built with scripts/probe-299/instrument.py
# (the observation also returns the stale-point guard's record, nothing else changed), clicks for real at points #301's
# emulation reads as stale-point refusals on still pages (Chrome: GitHub's code view, the tab strip, Wikipedia links;
# Safari's toolbar; Finder's title bar and list), and at controls; two repetitions on separate runners.
# Runs only on a push to probe/305-hosted (or by hand); not a ci-kit gate.
name: probe-305
on:
  push:
    branches: [probe/305-hosted]
  workflow_dispatch:
permissions:
  contents: read
env:
  P305_ENGINE_REF: c4057c3a7426606c65145f3a4b16c5d3d307febb
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        group: [safari, finder]  # chrome ran at 05a0afd3 (run 42251639474); this push re-runs the two whose resets posted keys
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the engine (instrumented) and the tool
        run: |
          sw_vers
          git worktree add "$RUNNER_TEMP/main" "$P305_ENGINE_REF"
          echo "P305_ENGINE_COMMIT=$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 -I scripts/probe-299/instrument.py "$RUNNER_TEMP/main/native/engine/Sources/Engine"
          swift build -c release --package-path "$RUNNER_TEMP/main/native/engine" --scratch-path "$RUNNER_TEMP/eng-main"
          swiftc -O -o "$RUNNER_TEMP/probe-tool" scripts/probe-299/tool.swift
      - name: Live
        env:
          P305_REP: ${{ matrix.rep }}
        run: node scripts/probe-305/live.mjs --group ${{ matrix.group }} --engine "$RUNNER_TEMP/eng-main/release/cua-engine" --tool "$RUNNER_TEMP/probe-tool" --out "$RUNNER_TEMP/probe-305"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-305-${{ matrix.group }}-rep${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/probe-305/*.json
            ${{ runner.temp }}/probe-305/*.gz
          if-no-files-found: warn
