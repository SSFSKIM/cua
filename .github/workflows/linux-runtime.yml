# The live Linux runs on GitHub's hosted runners (#171 M6a, T6, and M6b, T6; the M6b pre-flight
# docs/doperpowers/specs/2026-10-28-own-linux-engine-m6b-preflight.md §5.2, "Venues"): an arm64 leg on ubuntu-24.04-arm,
# the acceptance's arm64 venue, and an x64 leg on ubuntu-24.04 as its control. One recipe runs on both, so a failure on
# arm64 alone is the architecture's and a failure on both is the recipe's. Both suites run inside
# scripts/accept/linux-runtime-env.sh's environment (a private Xvfb with Openbox, a private session bus, accessibility
# on, homes of the run's, the sandbox scoped), after doctor's user-namespace remedy. The acceptance's upgraded home is
# made by the older cua's real install, which fetches the pinned vendor deb for the leg's architecture and unpacks it
# with ar and xz (F11; allowed on this dispatch-only lane, M6a's F8 (ii)); this cua fetches none.
#   acceptance (the default)  acceptance 13's cells, scripts/accept/linux-runtime.mjs: an empty home (E0 to E3), an
#                             upgraded home that the cua before M6b installs from a second checkout at `older` (U0 to
#                             U3), and two copies of its vendor release (U4, U5)
#   pilot                     the wave-0 venue pilot, scripts/accept/linux-runtime-pilot.mjs, on a commit of main's code:
#                             doctor's four environment rows, today's `cua install`, `sandbox.launcher`, the item 1 smoke
#                             with the shared confinement step, plain and under `strace -f`, answering its four questions
#
#   gh workflow run linux-runtime.yml --ref <branch> -f commit=<40-hex sha> -f older=<40-hex sha of the cua before M6b>
#   gh workflow run linux-runtime.yml --ref <branch> -f commit=<40-hex sha> -f suite=pilot
#
# The commit must be the head of the ref the run is dispatched on, as linux-engine.yml requires: the run tests what it
# names. The log and the artifact carry labels, outcomes, counts and scratch paths: the homes are the run's, the secret
# store is empty, and every window is the harness's.
name: linux-runtime
on:
  # A push of this file only registers the workflow, so it can be dispatched on a branch before it reaches main (as
  # linux-engine.yml was from feat/171-m1b); its jobs run on dispatch only.
  push:
    paths: ['.github/workflows/linux-runtime.yml']
  workflow_dispatch:
    inputs:
      commit:
        description: 'the cua commit to run (40 hex digits): the head of the ref this run is dispatched on'
        required: true
      suite:
        description: 'acceptance: acceptance 13 (scripts/accept/linux-runtime.mjs); pilot: the wave-0 venue pilot'
        type: choice
        options: [acceptance, pilot]
        default: acceptance
      older:
        description: 'acceptance only: the commit of the cua before M6b (40 hex digits) that installs the upgraded home'
        required: false
permissions: {}
concurrency:
  group: linux-runtime-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
env:
  COMMIT: ${{ inputs.commit }}
jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'pilot'
    name: pilot ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {arch: x64, runner: ubuntu-24.04}
    steps:
      - name: Check the commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be 40 lowercase hex digits" >&2; exit 1; }
          [[ "$COMMIT" == "$GITHUB_SHA" ]] || { echo "${GITHUB_REF} is at ${GITHUB_SHA}, not ${COMMIT}: dispatch on a ref whose head is the commit" >&2; exit 1; }
          # The run's directory: its homes, its scratch and the artifact.
          echo "RUN=${RUNNER_TEMP}/linux-runtime" >> "$GITHUB_ENV"
      - name: Check out the commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install cua's dependencies
        shell: bash
        run: npm ci
      - name: Install the desktop (Xvfb, Openbox, a session bus, AT-SPI, gedit, zenity), bubblewrap, strace and the deb's tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils openbox dbus dbus-bin at-spi2-core gedit zenity bubblewrap strace binutils xz-utils
      - name: Record bubblewrap's user namespace before the remedy
        shell: bash
        run: |
          # Not -e: bubblewrap's refusal here is an outcome to record, not a failure of the step.
          set +e -uo pipefail
          mkdir -p "$RUN"
          restrict="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          err="$(bwrap --ro-bind / / true 2>&1 >/dev/null)"; code=$?
          node -e 'const [code, restrict, err] = process.argv.slice(1); process.stdout.write(JSON.stringify({bwrap: Number(code), restrict, stderr: err.trim().split("\n").at(-1) || null}) + "\n")' "$code" "$restrict" "$err" | tee "$RUN/userns-before.json"
      - name: Apply the user-namespace remedy doctor names
        shell: bash
        run: |
          set -euo pipefail
          # USERNS_REMEDY, src/runtime/linux-desktop.mjs: lift Ubuntu's AppArmor restriction for this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the venue pilot
        shell: bash
        run: |
          set +e -uo pipefail
          status=0
          scripts/accept/linux-runtime-env.sh "$RUN" -- node scripts/accept/linux-runtime-pilot.mjs --out "$RUN/artifact" --leg "${{ matrix.arch }}" || status=$?
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const lines = [`### venue pilot, ${r.leg} (${r.arch}), ${process.env.COMMIT}`, "", "| step | status |", "|---|---|", ...r.steps.map(s => `| ${s.name} | ${s.status} |`),
              "", "| question | answer | why |", "|---|---|---|", ...Object.entries(r.answers).map(([q, a]) => `| ${q} | ${a.answer} | ${a.why ?? ""} |`),
              "", `verdict: ${r.verdict.pass ? "PASS" : "FAIL"}${r.verdict.problems.length ? ` (${r.verdict.problems.join("; ")})` : ""}`];
            process.stdout.write(lines.join("\n") + "\n");' "$RUN/artifact/pilot.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the pilot's report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-runtime-pilot-${{ matrix.arch }}
          # The pilot's projected reports only (ARTIFACT_FILES, scripts/accept/linux-runtime-pilot.mjs); the raw streams
          # stay in the run's scratch, which is never uploaded.
          path: |
            ${{ env.RUN }}/artifact/pilot.json
            ${{ env.RUN }}/artifact/smoke.json
            ${{ env.RUN }}/artifact/smoke-traced.json
          if-no-files-found: error
          retention-days: 30
  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'acceptance'
    name: acceptance 13 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {arch: x64, runner: ubuntu-24.04}
    env:
      OLDER: ${{ inputs.older }}
    steps:
      - name: Check the commits
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be 40 lowercase hex digits" >&2; exit 1; }
          [[ "$COMMIT" == "$GITHUB_SHA" ]] || { echo "${GITHUB_REF} is at ${GITHUB_SHA}, not ${COMMIT}: dispatch on a ref whose head is the commit" >&2; exit 1; }
          [[ "$OLDER" =~ ^[0-9a-f]{40}$ ]] || { echo "older must be the 40-hex commit of the cua before M6b, which installs the upgraded home" >&2; exit 1; }
          # The run's directory: its homes, its scratch and the artifact.
          echo "RUN=${RUNNER_TEMP}/linux-runtime" >> "$GITHUB_ENV"
      - name: Check out the commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Check out the cua before M6b
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.older }}
          path: older-cua
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install cua's dependencies, at the commit and in the older checkout
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          (cd older-cua && npm ci --omit=dev)
      - name: Install the desktop (Xvfb, Openbox, a session bus, AT-SPI, gedit, zenity), bubblewrap, strace, file and the older cua's deb tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # binutils and xz-utils are the older cua's (ar and xz unpack the vendor's deb in its install, F11); file is
          # E0's static-linkage check.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils openbox dbus dbus-bin at-spi2-core gedit zenity bubblewrap strace file binutils xz-utils
      - name: Apply the user-namespace remedy doctor names
        shell: bash
        run: |
          set -euo pipefail
          # USERNS_REMEDY, src/runtime/linux-desktop.mjs: lift Ubuntu's AppArmor restriction for this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run acceptance 13's cells
        shell: bash
        run: |
          set +e -uo pipefail
          status=0
          scripts/accept/linux-runtime-env.sh "$RUN" -- node scripts/accept/linux-runtime.mjs --out "$RUN/artifact" --older "$GITHUB_WORKSPACE/older-cua" --leg "${{ matrix.arch }}" || status=$?
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const cell = c => `| ${c.cell} | ${c.verdict?.pass ? "PASS" : "FAIL"} | ${(c.verdict?.problems ?? []).join("; ").replaceAll("|", "/")} |`;
            const lines = [`### acceptance 13, ${r.leg} (${r.arch}), ${r.head}, older ${r.older?.commit ?? "none"}`, "", "| cell | verdict | problems |", "|---|---|---|", ...r.cells.map(cell),
              "", `verdict: ${r.verdict.pass ? "PASS" : "FAIL"}${r.verdict.missing?.length ? ` (not run: ${r.verdict.missing.join(", ")})` : ""}${r.error ? ` (stopped: ${r.error})` : ""}`];
            process.stdout.write(lines.join("\n") + "\n");' "$RUN/artifact/runtime.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the cells' report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-runtime-acceptance-${{ matrix.arch }}
          # The driver's projected report only (scripts/accept/linux-runtime.mjs); the raw streams stay in the run's
          # scratch, which is never uploaded.
          path: |
            ${{ env.RUN }}/artifact/runtime.json
          if-no-files-found: error
          retention-days: 30
