name: probe-337
# Disposable #337 / #452 kit (scripts/probe-337/README.md), on #316's. A push of this file only registers the workflow on
# its branch; the hosted macOS runs go on dispatch, with the engine built unmodified from an exact SHA. kit=measure is
# #337's measurement (measure.mjs), kit=qualify the overlay qualification (qualify.mjs), one head per run.
on:
  push:
    branches: ['probe/337-measure']
    paths: ['.github/workflows/probe-337.yml']
  workflow_dispatch:
    inputs:
      engine:
        description: Exact 40-character engine SHA
        required: true
        type: string
      fix:
        description: qualify only, an exact 40-character candidate SHA run interleaved with engine (labelled main and fix); empty runs main alone
        type: string
        default: ''
      label:
        description: qualify only, the label of the engine head when it runs alone (main, or fix for a fix-only requal)
        type: string
        default: main
      kit:
        description: measure (#337's) or qualify (the overlay qualification)
        type: choice
        options: [measure, qualify]
        default: measure
      reps:
        description: Repetitions per unit (empty takes the kit's, 6 for measure and 5 for qualify)
        type: string
        default: ''
      cells:
        description: measure only, comma list (shared-behind, shared-behind-primed, shared-front, dedicated-behind)
        type: string
        default: ''
      seqs:
        description: measure only, comma list (zeroRow, typedRow, outside, outsideTyped)
        type: string
        default: ''
      overlays:
        description: qualify only, comma list (omnibox, select, datalist, permission, menu, popover)
        type: string
        default: ''
      modes:
        description: qualify only, comma list (shared-behind, shared-front, dedicated-behind)
        type: string
        default: ''
      sides:
        description: qualify only, comma list (inside, outside)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Registered; the measurement runs on dispatch with an exact engine SHA.'
  measure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 170
    env:
      ENGINE_SHA: ${{ inputs.engine }}
      FIX_SHA: ${{ inputs.fix }}
      LABEL: ${{ inputs.label }}
      KIT: ${{ inputs.kit }}
      REPS: ${{ inputs.reps }}
      CELLS: ${{ inputs.cells }}
      SEQS: ${{ inputs.seqs }}
      OVERLAYS: ${{ inputs.overlays }}
      MODES: ${{ inputs.modes }}
      SIDES: ${{ inputs.sides }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apps
        run: |
          bash scripts/probe-316/install.sh chrome
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
      - name: Build the engine and the tool
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$ENGINE_SHA^{commit}")" = "$ENGINE_SHA"
          sw_vers
          git log -1 --format='kit %H %s'
          swiftc -O -o "$RUNNER_TEMP/tool337" scripts/probe-337/tool.swift
          build() {
            git worktree add --detach "$RUNNER_TEMP/src-$1" "$2"
            git -C "$RUNNER_TEMP/src-$1" log -1 --format="$1 %H %s"
            echo "$1 tree status: [$(git -C "$RUNNER_TEMP/src-$1" status --porcelain 2>&1 | head -20)]"
            swift build -c release --package-path "$RUNNER_TEMP/src-$1/native/engine" --scratch-path "$RUNNER_TEMP/eng-$1"
          }
          build main "$ENGINE_SHA"
          if [[ -n "$FIX_SHA" ]]; then
            [[ "$FIX_SHA" =~ ^[0-9a-f]{40}$ && "$FIX_SHA" != "$ENGINE_SHA" ]]
            test "$(git rev-parse "$FIX_SHA^{commit}")" = "$FIX_SHA"
            build fix "$FIX_SHA"
          fi
      - name: Measure
        shell: bash
        run: |
          extra=()
          bin="$RUNNER_TEMP/eng-main/release/cua-engine"
          engines="${LABEL:-main}=$bin"
          refs="${LABEL:-main}=$ENGINE_SHA"
          if [[ -n "$FIX_SHA" ]]; then engines="$engines,fix=$RUNNER_TEMP/eng-fix/release/cua-engine"; refs="$refs,fix=$FIX_SHA"; fi
          if [ "$KIT" = qualify ]; then
            if [ -n "$OVERLAYS" ]; then extra+=(--overlays "$OVERLAYS"); fi
            if [ -n "$MODES" ]; then extra+=(--modes "$MODES"); fi
            if [ -n "$SIDES" ]; then extra+=(--sides "$SIDES"); fi
            P337_ENGINE_REFS="$refs" node scripts/probe-337/qualify.mjs --engines "$engines" \
              --tool "$RUNNER_TEMP/tool337" --out "$RUNNER_TEMP/probe-337" --reps "${REPS:-5}" --budget 140 "${extra[@]}"
            node scripts/probe-337/qsummary.mjs "$RUNNER_TEMP/probe-337/results.json" | tee "$RUNNER_TEMP/probe-337/summary.txt"
          else
            if [ -n "$CELLS" ]; then extra+=(--variants "$CELLS"); fi
            if [ -n "$SEQS" ]; then extra+=(--seqs "$SEQS"); fi
            P337_ENGINE_REF="$ENGINE_SHA" node scripts/probe-337/measure.mjs --engine "$bin" \
              --tool "$RUNNER_TEMP/tool337" --out "$RUNNER_TEMP/probe-337" --reps "${REPS:-6}" --budget 110 "${extra[@]}"
            node scripts/probe-337/summary.mjs "$RUNNER_TEMP/probe-337/results.json" | tee "$RUNNER_TEMP/probe-337/summary.txt"
          fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-337-${{ inputs.kit }}
          path: |
            ${{ runner.temp }}/probe-337/*.txt
            ${{ runner.temp }}/probe-316/install.txt
            ${{ runner.temp }}/probe-337/results.json
            ${{ runner.temp }}/probe-337/screens/*.jpg
            ${{ runner.temp }}/probe-337/shots/**/*.jpg
            ${{ runner.temp }}/probe-337/shots/**/*.png
          if-no-files-found: warn
