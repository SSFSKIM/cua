# #288's hosted probe. script probe (scripts/probe-288/probe.mjs): how soon a background Chrome for Testing reaches
# Chromium's complete accessibility mode, by trigger, behind a frontmost TextEdit; AXEnhancedUserInterface's side effects on
# the window's scripted move and resize; the toolbar's click-time establishment; origin/main's first click after each
# trigger. script live (scripts/probe-288/live.mjs, the push default): #292/#288's live check, fix/288-fresh-chrome's
# engine against origin/main's. Two repetitions on two runners. Runs only on a push to probe/288-hosted (or by hand);
# not a ci-kit gate.
name: probe-288
on:
  push:
    branches: [probe/288-hosted]
  workflow_dispatch:
    inputs:
      script:
        description: live (the engines' live check) or probe (the trigger spike)
        required: false
        default: live
      cells:
        description: --cells (label prefixes, comma-separated; empty for the script's default)
        required: false
        default: ''
permissions:
  contents: read
env:
  P288_MAIN_REF: d2568c76
  P288_BRANCH_REF: 96c6f093
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TCC rows for the services the engine needs
        run: |
          sw_vers
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceScreenCapture','kTCCServiceListenEvent') order by service, client" || true
          done
      - name: Build main's engine
        run: |
          git worktree add "$RUNNER_TEMP/main" "$P288_MAIN_REF"
          echo "P288_MAIN_COMMIT=$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build --package-path "$RUNNER_TEMP/main/native/engine" --scratch-path "$RUNNER_TEMP/eng"
      - name: Build the branch's engine
        if: github.event.inputs.script != 'probe'
        run: |
          git fetch --no-tags origin fix/288-fresh-chrome
          git worktree add "$RUNNER_TEMP/branch" "$P288_BRANCH_REF"
          echo "P288_BRANCH_COMMIT=$(git -C "$RUNNER_TEMP/branch" rev-parse HEAD)" >> "$GITHUB_ENV"
          swift build --package-path "$RUNNER_TEMP/branch/native/engine" --scratch-path "$RUNNER_TEMP/eng-branch"
      - name: Build the AX tool
        run: swiftc -O -o "$RUNNER_TEMP/p288-ax" scripts/probe-288/ax.swift
      - name: Live check
        if: github.event.inputs.script != 'probe'
        env:
          P288_REP: ${{ matrix.rep }}
          P288_CELLS: ${{ github.event.inputs.cells || '' }}
        run: node scripts/probe-288/live.mjs --main "$RUNNER_TEMP/eng/debug/cua-engine" --branch "$RUNNER_TEMP/eng-branch/debug/cua-engine" --ax "$RUNNER_TEMP/p288-ax" --cells "$P288_CELLS" --out "$RUNNER_TEMP/probe-288"
      - name: Probe
        if: github.event.inputs.script == 'probe'
        env:
          P288_REP: ${{ matrix.rep }}
          P288_ENGINE_COMMIT: ${{ env.P288_MAIN_COMMIT }}
          P288_CELLS: ${{ github.event.inputs.cells || 'tb/,r2/' }}
        run: node scripts/probe-288/probe.mjs --engine "$RUNNER_TEMP/eng/debug/cua-engine" --ax "$RUNNER_TEMP/p288-ax" --cells "$P288_CELLS" --out "$RUNNER_TEMP/probe-288"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-288-rep${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/probe-288/*.json
          if-no-files-found: warn
