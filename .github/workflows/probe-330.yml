# Hosted live measurement kit; no product changes. gate-* is the reusable #330 / #298 sweep.
# A/B heads run sequentially in each job: one engine process alive at a time.
name: probe-330
on:
  push:
    branches: ['probe/330-measure']
    paths-ignore: ['scripts/probe-330/offline/**', 'docs/**']
  workflow_dispatch:
    inputs:
      groups:
        description: groups as a JSON list (suggest-*, sweep-*, gate-safari/chrome/firefox/native)
        required: false
        default: ''
      ref:
        description: engine ref for a single-head run, or the main/control head of an A/B
        required: false
        default: ''
      branch_ref:
        description: the branch head for an A/B or branch run
        required: false
        default: ''
      engine:
        description: engine selection (shadow applies the runner-only patch)
        type: choice
        options: ['ab', 'main', 'shadow', 'branch']
        default: 'ab'
      reps:
        description: repetitions per cell
        required: false
        default: '1'
permissions:
  contents: read
env:
  # Quote refs: YAML reads an all-digit-and-e SHA as a float.
  P330_REF_DEFAULT: 'e31bb1f500d7f19e9cb5a858a4f4e2a255fb132d'
  P330_BRANCH_DEFAULT: '7f6eb3dcd2ed769ae80b2b7af12bafee62b764f5'
jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(github.event.inputs.groups || '["gate-chrome", "gate-safari", "gate-firefox", "gate-native", "suggest-chrome", "suggest-safari", "suggest-firefox", "sweep-chrome", "sweep-safari", "sweep-firefox"]') }}
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apps
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            *chrome) bash scripts/probe-316/install.sh chrome ;;
            *firefox)
              bash scripts/probe-316/install.sh firefox
              mkdir -p /Applications/Firefox.app/Contents/Resources/distribution
              printf '%s\n' '{"policies": {"DisableAppUpdate": true}}' > /Applications/Firefox.app/Contents/Resources/distribution/policies.json ;;
            *) bash scripts/probe-316/install.sh ;;
          esac
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
      - name: Build the engines and tools
        env:
          REF: ${{ github.event.inputs.ref || env.P330_REF_DEFAULT }}
          BRANCH_REF: ${{ github.event.inputs.branch_ref || env.P330_BRANCH_DEFAULT }}
          ENGINE: ${{ github.event.inputs.engine || 'ab' }}
        run: |
          sw_vers
          git log -1 --format='kit %H %s'
          swiftc -O -o "$RUNNER_TEMP/tool316" scripts/probe-316/tool.swift
          swiftc -O -o "$RUNNER_TEMP/mail330" scripts/probe-330/mail-like.swift
          if [ "$ENGINE" = ab ]; then HEADS='main branch'; else HEADS="$ENGINE"; fi
          for HEAD in $HEADS; do
            ENGINE_REF="$REF"
            if [ "$HEAD" = branch ]; then ENGINE_REF="$BRANCH_REF"; fi
            git worktree add --detach "$RUNNER_TEMP/src-$HEAD" "$ENGINE_REF"
            if [ "$HEAD" = shadow ]; then git -C "$RUNNER_TEMP/src-$HEAD" apply "$GITHUB_WORKSPACE/scripts/probe-330/shadow.patch"; fi
            git -C "$RUNNER_TEMP/src-$HEAD" log -1 --format="engine $HEAD %H %s"
            swift build -c release --package-path "$RUNNER_TEMP/src-$HEAD/native/engine" --scratch-path "$RUNNER_TEMP/eng-$HEAD"
          done
      - name: Measure
        env:
          GROUP: ${{ matrix.group }}
          REF: ${{ github.event.inputs.ref || env.P330_REF_DEFAULT }}
          BRANCH_REF: ${{ github.event.inputs.branch_ref || env.P330_BRANCH_DEFAULT }}
          ENGINE: ${{ github.event.inputs.engine || 'ab' }}
          REPS: ${{ github.event.inputs.reps || '1' }}
        run: |
          if [ "$ENGINE" = ab ]; then HEADS='main branch'; else HEADS="$ENGINE"; fi
          for HEAD in $HEADS; do
            ENGINE_REF="$REF"
            if [ "$HEAD" = branch ]; then ENGINE_REF="$BRANCH_REF"; fi
            P316_HEAD="$HEAD" P316_ENGINE_REF="$ENGINE_REF" P330_MAIL_APP="$RUNNER_TEMP/mail330" \
              node scripts/probe-330/measure.mjs --group "$GROUP" --engine "$RUNNER_TEMP/eng-$HEAD/release/cua-engine" --tool "$RUNNER_TEMP/tool316" \
              --out "$RUNNER_TEMP/probe-330/$GROUP/$HEAD" --reps "$REPS" --budget 65
          done
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-330-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/probe-316/*.txt
            ${{ runner.temp }}/probe-330/**/results.json
            ${{ runner.temp }}/probe-330/**/*.jsonl
            ${{ runner.temp }}/probe-330/**/screens/*.jpg
            ${{ runner.temp }}/probe-330/**/shots/**/*.jpg
            ${{ runner.temp }}/probe-330/**/shots/**/*.png
          if-no-files-found: warn
