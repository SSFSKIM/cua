# cua's CI gates, run by ci-kit (https://github.com/SSFSKIM/ci-kit/blob/main/docs/adopting.md): on pull requests, and
# from any worktree with `ci-gate`. Every gate runs on GitHub's hosted macOS runner, free for a public repo; an ubuntu
# leg waits for the Linux fixes in #142. Live checks that need the owner, a TCC grant or the native helper (verify.mjs,
# accept-native, accept-chrome, parity's computer lanes) stay on the Mac mini; the headless ones run in `sandbox-live`.
version: 1
setup:
  node: "24"          # Node 22 skips the own REPL host's tests
  install: npm ci
  fetch_depth: 0      # browser-parity and repl-parity tests read committed evidence revisions
gates:
  - name: test
    run: npm test
    lane: hosted-macos
    timeout: 20
  - name: plugin
    lane: hosted-macos
    timeout: 15
    # The claude CLI install hung once for 6 minutes on a hosted runner: each attempt is cut at 3 minutes, 3 attempts.
    # bun runs the vendored guard's shell-exec.ts (tests/mods/run-mods-tests.sh).
    run: |
      for attempt in 1 2 3; do
        perl -e 'alarm 180; exec @ARGV' npm i -g @anthropic-ai/claude-code bun && break
        [ "$attempt" = 3 ] && exit 1
      done
      claude plugin validate .
      npm run test:mods
  # #159: cua's headless macOS live checks (the #115 oracles, own-sandbox on both hosts, probe-secrets) on a runtime
  # `cua install` fetches into a scratch home, so a sandbox change is proven with no time on the Mac mini. Public logs:
  # labels, outcomes and booleans only; every secret is synthetic (scripts/sandbox-probe/hosted-gate.sh).
  - name: sandbox-live
    lane: hosted-macos
    timeout: 30
    run: sh scripts/sandbox-probe/hosted-gate.sh
    paths:
      - "src/sandbox/**"
      - "src/runtime/**"
      - "src/secrets/**"
      - "src/repl-host/**"
      - "src/services/**"
      - "bin/cua-codex-compat"
      - "runtime/**"
      - "scripts/sandbox-probe/**"
      - "scripts/accept/own-sandbox.mjs"
      - "scripts/accept/secret-seed.mjs"
      - "scripts/accept/serve-with-store.mjs"
      - "scripts/probe-secrets.mjs"
      - "scripts/probe/**"
      - "docs/evidence/2026-10-17-own-sandbox/m0/**"
      - ".github/ci-kit.yml"
    artifacts: [".hosted-gate/**"]
