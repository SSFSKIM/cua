# The golden generator for cua's seatbelt port (#115, M0): a dev-only binary over the original's own crates at
# openai/codex rust-v0.159.2 (ff6aec96948b70d94983af2641a6b67c94faeff5, Apache-2.0). `upstream` is a symlink that
# generate.sh points at a checkout of that commit; nothing here ships. See generate.sh.
[package]
name = "cua-sandbox-golden"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "cua-sandbox-golden"
path = "src/main.rs"

[dependencies]
codex-protocol = { path = "upstream/codex-rs/protocol" }
codex-sandboxing = { path = "upstream/codex-rs/sandboxing" }
codex-utils-absolute-path = { path = "upstream/codex-rs/utils/absolute-path" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Its own workspace, so the upstream checkout's workspace never claims it; `upstream` is excluded, because a path
# dependency inside a workspace's directory would otherwise become a member of it and lose its own workspace's
# inherited fields.
[workspace]
exclude = ["upstream"]

# Upstream's own patches at ff6aec96 (codex-rs/Cargo.toml): a workspace's patches do not reach a dependent workspace,
# so they are repeated here, revision for revision.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
