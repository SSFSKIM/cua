name: probe-367
# Registration run: matched #367/#366 product heads; ordinary CI is restricted to ci/**.
on:
  push:
    branches: ['probe/367-live']
    paths: ['.github/workflows/probe-367.yml', 'scripts/probe-367/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-367
  cancel-in-progress: false
jobs:
  live:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Save runner context before setup or builds
        run: |
          mkdir -p "$RUNNER_TEMP/evidence367"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const config = {
            kit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            runnerOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
            runnerArch: process.env.RUNNER_ARCH, node: process.version,
            authorizationPolicy: 'Non-prompting preflight only. Never request grants or change TCC.'
          };
          const save = () => fs.writeFileSync(process.env.RUNNER_TEMP + '/evidence367/setup.json', JSON.stringify(config, null, 2) + '\n');
          save();
          for (const [key, command, args] of [['os', '/usr/bin/sw_vers', []], ['kernel', '/usr/bin/uname', ['-a']], ['xcode', '/usr/bin/xcodebuild', ['-version']]]) {
            try { config[key] = execFileSync(command, args, {encoding: 'utf8'}); }
            catch (error) { config[key] = {error: error.message}; }
            save();
          }
          NODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build pinned real engines and owned spike fixture
        run: |
          set -euo pipefail
          node --test scripts/probe-367/evidence.test.mjs
          FIX_REF=a7c2fcc3310628e32c4d3760ceb1bd9aa4a4b69a
          MAIN_REF=136183aa196a8fd80a0dcc3fe933adff67f9cc39
          git worktree add --detach "$RUNNER_TEMP/src367-fix" "$FIX_REF"
          git worktree add --detach "$RUNNER_TEMP/src367-main" "$MAIN_REF"
          swift build -c release --package-path "$RUNNER_TEMP/src367-fix/native/engine" --scratch-path "$RUNNER_TEMP/build367-fix"
          swift build -c release --package-path "$RUNNER_TEMP/src367-main/native/engine" --scratch-path "$RUNNER_TEMP/build367-main"
          swiftc -O -o "$RUNNER_TEMP/oracle367" scripts/probe-367/oracle.swift
          npm ci --no-audit --no-fund
          node scripts/native-matrix/fixtures/electron-fixture.mjs --cache "$RUNNER_TEMP/fixture367" > "$RUNNER_TEMP/fixture367.json"
          node scripts/probe-367/instrument-fixture.mjs "$RUNNER_TEMP/fixture367.json"
          cp "$RUNNER_TEMP/fixture367.json" "$RUNNER_TEMP/evidence367/fixture.json"
          git -C "$RUNNER_TEMP/src367-fix" diff --exit-code
          git -C "$RUNNER_TEMP/src367-main" diff --exit-code
      - name: Exercise other-Space cells and on-screen controls on both heads
        env:
          ONLY_OTHER_SPACE: '1'
        run: |
          set -euo pipefail
          FIXTURE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).appPath)' "$RUNNER_TEMP/fixture367.json")
          mkdir -p "$RUNNER_TEMP/evidence367"
          status=0
          for head in main fix; do
            SHA=$(git -C "$RUNNER_TEMP/src367-$head" rev-parse HEAD)
            node scripts/probe-367/measure.mjs "$RUNNER_TEMP/src367-$head" "$RUNNER_TEMP/build367-$head/release/cua-engine" "$RUNNER_TEMP/oracle367" "$FIXTURE" "$RUNNER_TEMP/evidence367/$head" "$head" "$SHA" "$RUNNER_TEMP/fixture367.json" || status=1
          done
          exit "$status"
      - name: Upload only runner-owned evidence, never profiles
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: probe-367-live
          path: |
            ${{ runner.temp }}/evidence367/*.json
            ${{ runner.temp }}/evidence367/*/*.json
            ${{ runner.temp }}/evidence367/*/engine-stderr.txt
            ${{ runner.temp }}/evidence367/*/*.jpg
          if-no-files-found: warn
