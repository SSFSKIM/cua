# cua's CI gates, run by ci-kit (https://github.com/SSFSKIM/ci-kit/blob/main/docs/adopting.md): on pull requests, and
# from any worktree with `ci-gate`. Every gate runs on GitHub's hosted macOS runner, free for a public repo; an ubuntu
# leg waits for the Linux fixes in #142. Live checks that need the owner, a TCC grant or the native helper (verify.mjs,
# accept-native, accept-chrome, parity's computer lanes) stay on the Mac mini; the headless ones run in `sandbox-live`.
version: 1
setup:
  node: "24"          # Node 22 skips the own REPL host's tests
  install: npm ci
  fetch_depth: 0      # browser-parity and repl-parity tests read committed evidence revisions
gates:
  - name: test
    run: npm test
    lane: hosted-macos
    timeout: 20
  - name: plugin
    lane: hosted-macos
    timeout: 15
    # The claude CLI install hung once for 6 minutes on a hosted runner: each attempt is cut at 3 minutes, 3 attempts.
    # bun runs the vendored guard's shell-exec.ts (tests/mods/run-mods-tests.sh).
    run: |
      for attempt in 1 2 3; do
        perl -e 'alarm 180; exec @ARGV' npm i -g @anthropic-ai/claude-code bun && break
        [ "$attempt" = 3 ] && exit 1
      done
      claude plugin validate .
      npm run test:mods
  # #159: cua's headless macOS live checks (the #115 oracles, own-sandbox on both hosts, probe-secrets) on a runtime
  # `cua install` fetches into a scratch home, so a sandbox change is proven with no time on the Mac mini. Public logs
  # and artifact: labels, outcomes, booleans and counts (and the fingerprints' scratch paths); the raw reports stay in
  # the scratch root; every secret is synthetic (scripts/sandbox-probe/hosted-gate.sh's header).
  - name: sandbox-live
    lane: hosted-macos
    timeout: 30
    run: sh scripts/sandbox-probe/hosted-gate.sh
    # Every input whose change can alter the gate's result: the code under test, the probes, the committed evidence
    # they judge against, and this file.
    paths:
      - "src/sandbox/**"
      - "src/runtime/**"
      - "src/secrets/**"
      - "src/repl-host/**"
      - "src/services/**"
      - "src/mcp/**"            # own-sandbox's connection, probe-secrets' server
      - "src/cua-api/**"        # the own host's API, which the kernel reads
      - "src/cli.mjs"           # install and doctor
      - "bin/cua.mjs"
      - "bin/cua-codex-compat"
      - "runtime/**"
      - "scripts/sandbox-probe/**"
      - "scripts/accept/own-sandbox.mjs"
      - "scripts/accept/secret-seed.mjs"
      - "scripts/accept/serve-with-store.mjs"
      - "scripts/probe-secrets.mjs"
      - "scripts/probe/**"
      - "docs/evidence/2026-10-17-own-sandbox/m0/**"
      - "docs/evidence/2026-10-18-hosted-macos-gate/baseline/**"
      - ".github/ci-kit.yml"
    artifacts: ["hosted-gate-out/**"]
  # #159: repl-parity's live checks that need a browser but no owner or TCC grant, on a harness Chrome (Chrome for
  # Testing with cua's extension, a fresh profile) and the runner reaching itself as device `hosted-macos`
  # (scripts/repl-parity/hosted/hosted.sh's header). Two gates so they run on two runners at once. Public log only:
  # labels, outcomes, booleans and counts; no artifact.
  - name: sandbox-denials
    # cua's own host's cells and services suites under `log stream`: the assertions pass, no preferences (cfprefs)
    # denial, every denial kind in #115 M1's declared set. About 22 to 28 minutes with the setup.
    lane: hosted-macos
    timeout: 60
    run: sh scripts/repl-parity/hosted/hosted.sh denials
    # Every input whose change can alter its result: the sandbox and the own REPL host, the parity harness and the
    # suites it runs, the reduction and the judge, and this file.
    paths:
      - "src/sandbox/**"
      - "src/repl-host/**"
      - "src/runtime/**"
      - "src/cua-api/**"
      - "runtime/**"
      - "scripts/repl-parity.mjs"
      - "scripts/repl-parity/**"   # the harness, and hosted/ (this gate's script, judge and declared set)
      - "test/repl-parity/**"      # the suites' scenarios and the expected differences
      - "scripts/sandbox-probe/denials.mjs"
      - ".github/ci-kit.yml"
  - name: parity-browser
    # The vendor host and cua's own host over suites api and docs-profiles, each pair diffed with the declared expected
    # differences: none undeclared. About 12 minutes with the setup.
    lane: hosted-macos
    timeout: 40
    run: sh scripts/repl-parity/hosted/hosted.sh browser
    # sandbox-denials' inputs, and the browser path.
    paths:
      - "src/sandbox/**"
      - "src/repl-host/**"
      - "src/runtime/**"
      - "src/cua-api/**"
      - "runtime/**"
      - "scripts/repl-parity.mjs"
      - "scripts/repl-parity/**"   # the harness, and hosted/ (this gate's script, judge and declared set)
      - "test/repl-parity/**"      # the suites' scenarios and the expected differences
      - "scripts/sandbox-probe/denials.mjs"
      - ".github/ci-kit.yml"
      - "src/browser-service/**"
      - "src/mcp/**"
      - "src/chrome/**"
      - "src/profiles/**"
      - "extension/**"
