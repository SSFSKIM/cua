# #330's hosted kit (measure first): a page-made suggestion list over the point a coordinate click aims at. The suggest-*
# groups run the dropdown cells (scripts/probe-330/measure.mjs); the sweep-* groups are #316's still-page gate plus the
# near-change scenes, the candidates' false-refusal price. Each job builds main with scripts/probe-330/shadow.patch (the
# candidate rules reported in the click's meta as `shadow330`, never refusing; runner-only) and runs the kit once.
# Runs only on a push to probe/330-measure (or by hand); not a ci-kit gate.
name: probe-330
on:
  push:
    branches: ['probe/330-measure']
    paths-ignore: ['scripts/probe-330/offline/**', 'docs/**']
  workflow_dispatch:
    inputs:
      groups:
        description: the groups, a JSON list (suggest-safari, suggest-chrome, suggest-firefox, sweep-safari, sweep-chrome, sweep-firefox, sweep-native)
        required: false
        default: ''
      ref:
        description: the engine ref the patch is applied to (empty for the push default)
        required: false
        default: ''
      reps:
        description: repetitions per cell
        required: false
        default: '1'
permissions:
  contents: read
env:
  # Quoted: YAML reads an all-digit-and-e SHA as a float. main after #328 (#338).
  P330_REF_DEFAULT: '6baaa12af587fb546717f04e939302fa6a643211'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(github.event.inputs.groups || '["suggest-chrome", "suggest-safari", "suggest-firefox", "sweep-chrome", "sweep-safari", "sweep-firefox", "sweep-native"]') }}
    runs-on: macos-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apps
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            *chrome) bash scripts/probe-316/install.sh chrome ;;
            *firefox)
              bash scripts/probe-316/install.sh firefox
              mkdir -p /Applications/Firefox.app/Contents/Resources/distribution
              printf '%s\n' '{"policies": {"DisableAppUpdate": true}}' > /Applications/Firefox.app/Contents/Resources/distribution/policies.json ;;
            *) bash scripts/probe-316/install.sh ;;
          esac
          defaults write com.apple.TextEdit ApplePersistenceIgnoreState -bool YES
          defaults write com.apple.TextEdit NSQuitAlwaysKeepsWindows -bool NO
      - name: Build the patched engine and the tool
        env:
          REF: ${{ github.event.inputs.ref || env.P330_REF_DEFAULT }}
        run: |
          sw_vers
          git log -1 --format='kit %H %s'
          swiftc -O -o "$RUNNER_TEMP/tool316" scripts/probe-316/tool.swift
          git worktree add --detach "$RUNNER_TEMP/src" "$REF"
          git -C "$RUNNER_TEMP/src" apply "$GITHUB_WORKSPACE/scripts/probe-330/shadow.patch"
          git -C "$RUNNER_TEMP/src" log -1 --format='engine %H %s'
          git -C "$RUNNER_TEMP/src" diff --stat
          swift build -c release --package-path "$RUNNER_TEMP/src/native/engine" --scratch-path "$RUNNER_TEMP/eng"
      - name: Measure
        env:
          GROUP: ${{ matrix.group }}
          REF: ${{ github.event.inputs.ref || env.P330_REF_DEFAULT }}
          REPS: ${{ github.event.inputs.reps || '1' }}
        run: |
          P316_HEAD=shadow P316_ENGINE_REF="$REF" \
            node scripts/probe-330/measure.mjs --group "$GROUP" --engine "$RUNNER_TEMP/eng/release/cua-engine" --tool "$RUNNER_TEMP/tool316" \
            --out "$RUNNER_TEMP/probe-330/$GROUP" --reps "$REPS" --budget 105
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-330-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/probe-316/*.txt
            ${{ runner.temp }}/probe-330/**/results.json
            ${{ runner.temp }}/probe-330/**/screens/*.jpg
            ${{ runner.temp }}/probe-330/**/shots/**/*.jpg
            ${{ runner.temp }}/probe-330/**/shots/**/*.png
          if-no-files-found: warn
