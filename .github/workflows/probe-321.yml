# #321's hosted A/B: A = origin/main's engine, B = the fix (fix/321-hold), both built here, one engine process per head,
# head order alternating by repetition, on #282's original Safari cells, Safari page clicks, Chrome for Testing and
# TextEdit behind another app, every click watched at 5 ms (scripts/probe-321/run.sh). Runs only on a push to
# probe/321-ab that touches it (or by hand); not a ci-kit gate.
name: probe-321
on:
  push:
    branches: [probe/321-ab]
    paths: ['scripts/probe-321/**', 'scripts/probe-282/**', '.github/workflows/probe-321.yml', '!scripts/probe-321/offline/**']
  workflow_dispatch:
    inputs:
      parts:
        description: the parts, a JSON list (k282-1..4, page-1, page-2, ctl-chrome, ctl-textedit, conf-safari, conf-textedit, conf-chrome)
        required: false
        default: ''
permissions:
  contents: read
env:
  # Quoted: YAML reads an all-digit-and-e SHA as a float.
  P321_A_REF: '602b7093ac51b055eb9e238546b94c22fea9659e'
  P321_B_REF: '3436cfaa2bd39208985cd4465846c9854767508d'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event.inputs.parts || '["conf-safari", "conf-textedit", "conf-chrome"]') }}
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Browsers
        run: bash scripts/probe-287/install.sh
      - name: Build the engines and the tools
        run: |
          sw_vers
          git log -1 --format='kit %H %s'
          swiftc -O -o "$RUNNER_TEMP/p321-win" scripts/probe-321/win.swift
          swiftc -o "$RUNNER_TEMP/p282-hit" scripts/probe-282/hit.swift
          app="$RUNNER_TEMP/Probe313.app/Contents"
          mkdir -p "$app/MacOS"
          swiftc -O -o "$app/MacOS/Probe313" scripts/probe-313/app.swift
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleIdentifier</key><string>com.ssfskim.probe313</string>' \
            '<key>CFBundleName</key><string>Probe313</string>' \
            '<key>CFBundleExecutable</key><string>Probe313</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>NSPrincipalClass</key><string>NSApplication</string>' \
            '</dict></plist>' > "$app/Info.plist"
          for h in A B; do
            ref="P321_${h}_REF"
            git worktree add "$RUNNER_TEMP/src$h" "${!ref}"
            git -C "$RUNNER_TEMP/src$h" log -1 --format="$h %H %s"
            swift build -c release --package-path "$RUNNER_TEMP/src$h/native/engine" --scratch-path "$RUNNER_TEMP/eng$h"
          done
      - name: Measure
        env:
          PART: ${{ matrix.part }}
        run: bash scripts/probe-321/run.sh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-321-ab-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/probe-321/**/results.json
          if-no-files-found: warn
